# DevAI Live Preview — Phase 0 SPIKE (throwaway).
#
# Proves the two things the whole preview design rests on:
#   1. HMR / WebSocket survives the trip through devai-auth-bff (the auth proxy).
#   2. A single PVC is shared across the preview container set (edits in one
#      container hot-reload the dev server in another).
#
# It stands up a minimal Vite app whose HMR client is pointed at :443 so the
# HMR WebSocket connects back through the public host (wss://preview-spike.tesserix.app)
# → Istio → devai-auth-bff → this pod. The session cookie gates it (you must be
# logged into devai.tesserix.app first; same .tesserix.app cookie).
#
# Prereqs (one-time, already in this change set):
#   - devai-auth-bff built+deployed from the branch that adds the preview proxy
#     (DEVAI_BFF_PREVIEW_DOMAIN=tesserix.app, DEVAI_BFF_PREVIEW_NAMESPACE=devai-previews).
#
# This is a SPIKE: throwaway, single hardcoded session id "spike". Delete after:
#   kubectl delete ns devai-previews
---
apiVersion: v1
kind: Namespace
metadata:
  name: devai-previews
  labels:
    istio-injection: enabled
    devai.tesserix.app/role: previews
---
# Mesh is deny-all by default; allow the auth-bff (devai ns) to reach preview
# Services, and the ingress gateway path. Bounded to this namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-bff-to-previews
  namespace: devai-previews
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["devai", "istio-ingress", "istio-system"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preview-spike-work
  namespace: devai-previews
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-spike            # == leftmost label of preview-spike.tesserix.app
  namespace: devai-previews
  labels: { app.kubernetes.io/name: preview-spike }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: preview-spike } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: preview-spike }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      # Init: write a minimal Vite app into the shared PVC. (Real previews
      # git-clone here instead; this keeps the spike self-contained.)
      initContainers:
        - name: seed-app
          image: node:20-bookworm-slim
          command: ["sh", "-lc"]
          args:
            - |
              set -e
              cd /work
              if [ ! -f package.json ]; then
                cat > package.json <<'JSON'
              { "name": "spike", "private": true, "type": "module",
                "scripts": { "dev": "vite" },
                "devDependencies": { "vite": "^5.4.0" } }
              JSON
                cat > index.html <<'HTML'
              <!doctype html><html><head><title>DevAI preview spike</title></head>
              <body><div id="app"></div><script type="module" src="/src/main.js"></script></body></html>
              HTML
                mkdir -p src
                cat > src/main.js <<'JS'
              document.getElementById('app').innerHTML =
                '<h1 style="font-family:sans-serif">DevAI preview spike — v1</h1>' +
                '<p>Edit src/main.js in the editor sidecar; this should hot-reload.</p>';
              JS
                # HMR client must dial the PUBLIC https port so the WS comes back
                # through the BFF; allow the preview host.
                cat > vite.config.js <<'CFG'
              export default {
                server: {
                  host: true, port: 3000, strictPort: true,
                  allowedHosts: true,
                  hmr: { clientPort: 443, protocol: 'wss' },
                },
              };
              CFG
              fi
          volumeMounts: [{ name: work, mountPath: /work }]
      containers:
        # The dev server (HMR). Shares /work with the editor sidecar.
        - name: dev-server
          image: node:20-bookworm-slim
          workingDir: /work
          command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: "development" }
          ports: [{ name: dev, containerPort: 3000 }]
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 40
          volumeMounts: [{ name: work, mountPath: /work }]
          resources: { requests: { memory: 768Mi }, limits: { memory: 2Gi } }
        # Stand-in for the editor-bridge: lets you exec in and edit /work to
        # prove cross-container edits trigger HMR over the shared PVC.
        - name: editor
          image: busybox:1.36
          command: ["sh", "-lc", "sleep infinity"]
          volumeMounts: [{ name: work, mountPath: /work }]
          resources: { requests: { memory: 32Mi }, limits: { memory: 64Mi } }
      volumes:
        - name: work
          persistentVolumeClaim: { claimName: preview-spike-work }
---
apiVersion: v1
kind: Service
metadata:
  name: preview-spike            # BFF maps preview-spike.tesserix.app -> this
  namespace: devai-previews
  labels: { app.kubernetes.io/name: preview-spike }
spec:
  selector: { app.kubernetes.io/name: preview-spike }
  ports: [{ name: dev, port: 80, targetPort: 3000 }]   # port 80 = the BFF's upstream
---
# Route the preview host to the BFF (NOT directly to the Service) so the
# devai_session check applies. Exact host for the spike; Phase 1 swaps this for
# a single *.tesserix.app catch-all → BFF (BFF 404s non-preview labels).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: preview-spike
  namespace: devai-previews
spec:
  gateways: ["istio-ingress/tesseract-gateway"]
  hosts: ["preview-spike.tesserix.app"]
  http:
    - route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port: { number: 8090 }
      timeout: 0s     # 0 = no timeout; HMR WebSocket is long-lived

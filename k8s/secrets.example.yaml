# ─────────────────────────────────────────────────────────────────────────
# DevAI — LOCAL secrets template (kind / sandboxctl)
#
# This is the LOCAL equivalent of the GCP-Secret-Manager-backed
# ExternalSecrets used in prod (tesserix-k8s/external-secrets/prod/devai/).
# There is no External Secrets Operator on kind, so we apply one plain
# Secret directly.
#
# SHARED LOCAL INFRA: DevAI no longer runs its own Postgres/Redis locally — it
# connects to the shared local-infra datastores (deploy the local-infra chart
# first). The Secret `local-infra-creds` is REFLECTED into the devai namespace
# and carries the SAME throwaway password ("local-sandbox-dev") as the named
# Secrets below. DevAI's deployments hardcode the Secret names
# postgresql-devai-password / redis-devai-password, so we keep those named
# Secrets here — just pinned to the shared password.
#
# USAGE
#   1. cp k8s/secrets.example.yaml k8s/secrets.yaml
#   2. Replace every REPLACEME_* with a real value (plain text — stringData
#      is base64-encoded by Kubernetes for you).
#   3. `sandboxctl deploy` (run from the repo root) finds k8s/secrets.yaml
#      and applies it into the devai namespace before syncing the chart.
#      k8s/secrets.yaml is gitignored — never commit real secrets.
#
# Only DEVAI_ANTHROPIC_API_KEY (or GROQ/GEMINI) and the GitHub creds are
# needed to exercise the onboarding / Repos flow locally. The rest can stay
# REPLACEME if you're not using that subsystem — the app degrades instead of
# crashing when a key is absent.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: devai-secrets
  namespace: devai          # sandboxctl rewrites this to the deploy namespace
type: Opaque
stringData:
  # ── Datastore passwords (shared local-infra Postgres + Redis) ──
  # Must equal the shared local-infra CNPG/Redis password.
  POSTGRES_PASSWORD: "local-sandbox-dev"
  REDIS_PASSWORD: "local-sandbox-dev"

  # ── LLM providers (at least one recommended; others may stay REPLACEME) ──
  DEVAI_ANTHROPIC_API_KEY: "REPLACEME_anthropic_key"
  DEVAI_OPENAI_API_KEY: "REPLACEME_openai_key"
  DEVAI_GROQ_API_KEY: "REPLACEME_groq_key"
  DEVAI_GEMINI_API_KEY: "REPLACEME_gemini_key"

  # ── GitHub — PAT path (simplest for local onboarding/Repos testing) ──
  # Fine-grained or classic PAT with repo scope. DEVAI_SCM_AUTH_METHOD=pat
  # is set in the chart, so this is the credential the SCM client uses.
  DEVAI_SCM_TOKEN: "REPLACEME_github_pat"

  # ── GitHub — App path (optional; only if testing GitHub App auth) ──
  # Leave as REPLACEME to stay on the PAT path above.
  DEVAI_GITHUB_APP_ID: "REPLACEME_github_app_id"
  DEVAI_GITHUB_APP_PRIVATE_KEY: "REPLACEME_github_app_private_key_pem"
  DEVAI_GITHUB_APP_INSTALLATION_ID: "REPLACEME_github_app_installation_id"
  DEVAI_GITHUB_WEBHOOK_SECRET: "REPLACEME_github_webhook_secret"

  # ── Dashboard OAuth / Keycloak (optional locally) ──
  DEVAI_GITHUB_OAUTH_CLIENT_ID: "REPLACEME_github_oauth_client_id"
  DEVAI_GITHUB_OAUTH_CLIENT_SECRET: "REPLACEME_github_oauth_client_secret"
  DEVAI_KEYCLOAK_CLIENT_SECRET: "REPLACEME_keycloak_client_secret"

  # ── Observability (optional) ──
  DEVAI_LANGCHAIN_API_KEY: "REPLACEME_langsmith_api_key"   # prod GCP SM: prod-devai-langsmith-api-key

  # ── Cloudflare (optional; prod devai-api-secrets carries these) ──
  DEVAI_CLOUDFLARE_API_TOKEN: "REPLACEME_cloudflare_api_token"   # prod GCP SM: prod-devai-cloudflare-api-token
  DEVAI_CLOUDFLARE_ACCOUNT_ID: "REPLACEME_cloudflare_account_id" # prod GCP SM: prod-devai-cloudflare-account-id
---
# ═══════════════════════════════════════════════════════════════════════════
# ADDITIONAL Secrets for the tesserix-k8s per-chart values-local.yaml flow
# ───────────────────────────────────────────────────────────────────────────
# The single `devai-secrets` block above feeds the all-in-one k8s/chart used by
# `sandboxctl deploy`. The Secrets BELOW are for the SEPARATE, additive flow
# that deploys the individual tesserix-k8s charts with their values-local.yaml:
#
#   tesserix-k8s/charts/apps/local-infra            (SHARED Postgres/Redis/NATS/Mongo)
#   tesserix-k8s/charts/apps/devai-api      -f values-local.yaml
#   tesserix-k8s/charts/apps/devai-sre      -f values-local.yaml
#   tesserix-k8s/charts/apps/devai-dashboard
#   tesserix-k8s/charts/apps/devai-sre-dashboard
#   tesserix-k8s/charts/apps/devai-auth-bff -f values-local.yaml
#
# Those charts reference fixed Secret NAMES in their deployment templates (same
# names as prod, just plain Secrets locally instead of ExternalSecrets). Apply
# whichever set matches the flow you use. See k8s/README.md for details.
#
#   kubectl -n devai apply -f k8s/secrets.yaml
#
# postgresql-devai-password/password and redis-devai-password/password MUST hold
# the shared local-infra password "local-sandbox-dev" (the same value carried by
# the reflected local-infra-creds Secret) so the app deployments authenticate to
# the shared CNPG role / Redis when building DEVAI_DATABASE_URL / DEVAI_REDIS_URL.
# ═══════════════════════════════════════════════════════════════════════════
---
# DB password consumed by devai-api / devai-sre (secretKeyRef
# postgresql-devai-password/password). Must equal the shared local-infra CNPG
# devai role password (also reflected via local-infra-creds).
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-devai-password
  namespace: devai
type: Opaque
stringData:
  password: "local-sandbox-dev"
---
# Redis password consumed by devai-api / devai-sre (secretKeyRef
# redis-devai-password/password). Must equal the shared local-infra Redis
# password (also reflected via local-infra-creds).
apiVersion: v1
kind: Secret
metadata:
  name: redis-devai-password
  namespace: devai
type: Opaque
stringData:
  password: "local-sandbox-dev"
---
# LLM / SCM / auth keys consumed by devai-api and devai-sre (secretKeyRef
# devai-api-secrets/<KEY>). Fill in the providers you use; the rest can stay as
# placeholders — the app degrades gracefully when a key is absent.
apiVersion: v1
kind: Secret
metadata:
  name: devai-api-secrets
  namespace: devai
type: Opaque
stringData:
  DEVAI_OPENAI_API_KEY: "REPLACEME_openai_key"
  DEVAI_ANTHROPIC_API_KEY: "REPLACEME_anthropic_key"
  DEVAI_GROQ_API_KEY: "REPLACEME_groq_key"
  DEVAI_GEMINI_API_KEY: "REPLACEME_gemini_key"
  DEVAI_LANGCHAIN_API_KEY: "REPLACEME_langsmith_api_key"
  DEVAI_KEYCLOAK_CLIENT_SECRET: "REPLACEME_keycloak_client_secret"
  DEVAI_GITHUB_APP_ID: "0"
  DEVAI_GITHUB_APP_PRIVATE_KEY: "REPLACEME_github_app_private_key_pem"
  DEVAI_GITHUB_APP_INSTALLATION_ID: "0"
  DEVAI_GITHUB_WEBHOOK_SECRET: "REPLACEME_github_webhook_secret"
  DEVAI_GITHUB_OAUTH_CLIENT_ID: "REPLACEME_github_oauth_client_id"
  DEVAI_GITHUB_OAUTH_CLIENT_SECRET: "REPLACEME_github_oauth_client_secret"
  DEVAI_CLOUDFLARE_API_TOKEN: "REPLACEME_cloudflare_api_token"
  DEVAI_CLOUDFLARE_ACCOUNT_ID: "REPLACEME_cloudflare_account_id"
---
# GitHub PAT consumed by devai-api for SCM operations (secretKeyRef
# devai-github-pat/token). A throwaway repo-scoped PAT for local use.
apiVersion: v1
kind: Secret
metadata:
  name: devai-github-pat
  namespace: devai
type: Opaque
stringData:
  token: "REPLACEME_github_pat"
---
# auth-bff secrets consumed by devai-auth-bff (secretKeyRef
# devai-auth-bff-secrets/<KEY>). Created here because the values-local.yaml
# overlay disables the ExternalSecret. SESSION_ENCRYPT_KEY MUST be exactly
# 16, 24, or 32 raw bytes (AES-128/192/256-GCM).
#
# The TENANT IDs below are placeholders. The login flow over *.sandbox.app
# needs (a) sandbox.app registered as a GIP Authorized domain and (b) DEDICATED
# local tenants so you don't touch the prod pools. Run once to provision both
# and get the real IDs + web API key:
#
#   PROJECT=tesseracthub-480811 tesserix-k8s/local/gip-local-setup.sh
#
# then paste the printed DEVAI_BFF_ALM_TENANT_ID / SRE_TENANT_ID / GIP_WEB_API_KEY
# here. (auth-bff is OPTIONAL locally — skip it unless you're testing real login;
# the devai-api endpoints work without it.)
apiVersion: v1
kind: Secret
metadata:
  name: devai-auth-bff-secrets
  namespace: devai
type: Opaque
stringData:
  DEVAI_BFF_ALM_TENANT_ID: "REPLACEME_devai-local-alm_tenant_id"
  DEVAI_BFF_SRE_TENANT_ID: "REPLACEME_devai-local-sre_tenant_id"
  DEVAI_BFF_SESSION_ENCRYPT_KEY: "0123456789abcdef0123456789abcdef"  # 32 bytes; change for real use
  DEVAI_BFF_ADMIN_ALLOWED_EMAILS: "you@example.com"
  DEVAI_BFF_GIP_WEB_API_KEY: "REPLACEME_gip_web_api_key"

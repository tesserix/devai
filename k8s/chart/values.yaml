# DevAI local chart values. Tuned for kind + sandboxctl.
#
# sandboxctl injects image.repository=localhost:5050/devai and image.tag
# via Argo helm parameters, so the image block below is only a sane default
# for `helm template`/`helm install` outside sandboxctl.

image:
  repository: localhost:5050/devai
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# The Secret created from k8s/secrets.yaml. All credential env is pulled
# from here; DB/Redis URLs are assembled in the deployment from the
# password keys.
secretName: devai-secrets

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # sandboxctl routes <chart>.sandbox.app to the Service tagged primary.
  primaryAnnotation: true

# Non-secret env (mirrors the prod chart, retargeted for local).
env:
  DEVAI_HOST: "0.0.0.0"
  DEVAI_PORT: "8080"
  DEVAI_LOG_LEVEL: "info"
  DEVAI_SCM_PROVIDER: "github"
  DEVAI_SCM_AUTH_METHOD: "pat"        # use the PAT in devai-secrets (flip to github_app to test App auth)
  DEVAI_GITHUB_ORG: "tesserix"
  DEVAI_CLAUDE_MODEL: "claude-sonnet-5"
  DEVAI_GROQ_MODEL: "llama-3.3-70b-versatile"
  DEVAI_ADMIN_EMAILS: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"
  # Meter is visible but unenforced until DEVAI_LLM_REQUIRE_USER_CONNECTOR=true.
  # Trial counters never reset, so exhaustion revokes the shared keys for good.
  DEVAI_LLM_TRIAL_TOKEN_BUDGET: "200000"
  DEVAI_LLM_REQUIRE_USER_CONNECTOR: "false"
  # Local = fewer moving parts: no NATS, no LangSmith, no K8s job runtime.
  # Memory runs on the sandbox Redis so the learn/inject loop is actually
  # exercised in dev (noop would silently discard every write).
  DEVAI_EVENT_BUS_PROVIDER: "noop"
  DEVAI_MEMORY_PROVIDER: "redis"
  DEVAI_LANGCHAIN_TRACING_V2: ""
  DEVAI_K8S_RUNTIME_ENABLED: "false"
  DEVAI_PIPELINE_ENABLED: "true"
  DEVAI_ONBOARDING_RECONCILE_ON_BOOT: "true"
  # Registry backend. Locally this is the agentregistry server that
  # `sandboxctl up --with-agentregistry` installs (same component prod's
  # DEVAI_AREGISTRY_URL points at, port 12121). Both env names alias the
  # same URL. If you didn't enable --with-agentregistry, leave these and
  # the registry client simply degrades.
  DEVAI_REGISTRY_URL: "http://aregistry-agentregistry.aregistry.svc.cluster.local:12121"
  DEVAI_AREGISTRY_URL: "http://aregistry-agentregistry.aregistry.svc.cluster.local:12121"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

serviceAccount:
  create: true
  name: ""

# ── Bundled datastores (kind has no CNPG / managed Redis) ──
postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: devai_db
  user: devai
  # password comes from secretName key POSTGRES_PASSWORD
  storage: 2Gi
  port: 5432

redis:
  enabled: true
  image: redis:7-alpine
  # password comes from secretName key REDIS_PASSWORD
  port: 6379

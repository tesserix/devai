{{- if .Values.sandbox.namespaceIsolation }}
# Sandboxes live in throwaway devai-sbx-* namespaces, so the control plane
# needs cluster-scoped rights: Namespace lifecycle plus the sandbox kinds
# it creates inside them (and cluster-wide Job watch for the JobWatcher).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devai-sandbox-manager
  labels:
    {{- include "devai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets", "configmaps", "services", "serviceaccounts", "resourcequotas", "limitranges", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devai-sandbox-manager
  labels:
    {{- include "devai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: devai-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}

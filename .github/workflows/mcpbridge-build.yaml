name: DevAI MCP Bridge - CI Build

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
    paths:
      - 'src/devai/mcpbridge/**'
      - 'Dockerfile.mcpbridge'
      - 'pyproject.toml'
      - '.github/workflows/mcpbridge-build.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/devai/mcpbridge/**'
      - 'Dockerfile.mcpbridge'
      - '.github/workflows/mcpbridge-build.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devai-mcp-bridge
  GCP_PROJECT_ID: tesseracthub-480811
  GKE_CLUSTER: tesseract-prod-in-gke
  GKE_REGION: asia-south1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Ruff lint bridge module
        run: ruff check src/devai/mcpbridge/
      - name: Run bridge tests
        run: pytest tests/unit/test_mcpbridge.py -v --tb=short
        continue-on-error: true

  build:
    name: Build & Push MCP Bridge
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: lint-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP (WIF)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: auth_wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/849928263410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=devai-mcp-bridge
            org.opencontainers.image.description=DevAI MCP Bridge — stdio MCP servers over streamable-https

      - name: Compute cache ref
        id: cache
        run: echo "ref=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcpbridge
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.cache.outputs.ref) || '' }}

      # No rollout-restart here: ensure-image-tags re-tags :latest as
      # main-<sha> for the bridge too, and Kargo's prod stage sets the
      # devai-mcp-bridge ArgoCD app's image.tag to that sha (same as the other
      # devai images). The WIF auth above stays for the Trivy/security steps.

      - name: Trivy vulnerability scan (SARIF)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-mcpbridge.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Trivy to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-mcpbridge.sarif
          category: mcpbridge
        continue-on-error: true

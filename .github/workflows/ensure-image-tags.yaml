name: Ensure image tags

# Kargo discovers the newest build from the GIT commit graph (immune to the
# registry tag-list pagination that broke NewestBuild image discovery once a
# repo accrued >100 tags). The prod Stage then deploys main-<sha7> for EVERY
# devai image. But CI is path-filtered, so a given commit only builds the
# images whose sources changed — the rest never get a main-<sha> tag and would
# ImagePullBackOff.
#
# This job closes that gap: on every push to main it waits for this commit's
# image-build workflows to finish, then tags each image's freshly-built
# `:latest` as `main-<sha7>`. Changed images get their new build's :latest;
# unchanged images get their current :latest (the correct version at this
# commit). Auth BFF and MCP Bridge are copied to direct GAR because production
# must not depend on pull-through cache state or upstream package visibility.
on:
  push:
    branches: [main]
    # No paths filter — must run for EVERY commit so every image is tagged.
  workflow_dispatch:

permissions:
  contents: write # advance the `deploy` branch marker
  id-token: write # exchange GitHub OIDC for GAR write access
  packages: write

concurrency:
  group: ensure-image-tags-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GAR_REGISTRY: asia-south1-docker.pkg.dev
  GAR_REPOSITORY: tesseracthub-480811/global
  OWNER_REPO: ${{ github.repository }} # tesserix/devai

jobs:
  ensure-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit's image builds to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The image-build workflows. Any that were triggered for this SHA
          # (path-filtered) must reach a terminal state before we read :latest,
          # so we never tag a stale pre-build image.
          BUILD_WFS="ci.yaml runner-build.yaml dashboard-build.yaml sre-build.yaml sre-dashboard-build.yaml auth-bff-build.yaml mcpbridge-build.yaml"
          SHA="${{ github.sha }}"
          settled=false
          for i in $(seq 1 60); do   # up to ~30 min
            pending=0
            for wf in $BUILD_WFS; do
              # runs of THIS workflow for THIS commit still in flight
              n=$(gh run list --repo "$OWNER_REPO" --workflow "$wf" --limit 30 \
                    --json headSha,status \
                    -q "[.[] | select(.headSha==\"$SHA\" and (.status==\"in_progress\" or .status==\"queued\"))] | length")
              pending=$((pending + n))
            done
            if [ "$pending" -eq 0 ]; then
              settled=true
              echo "all builds settled"
              break
            fi
            echo "  $pending build run(s) still in flight — waiting ($((i*30))s)"
            sleep 30
          done
          if [ "$settled" != true ]; then
            echo "::error::timed out waiting for image builds"
            exit 1
          fi

          failed=0
          for wf in $BUILD_WFS; do
            n=$(gh run list --repo "$OWNER_REPO" --workflow "$wf" --limit 30 \
                  --json headSha,status,conclusion \
                  -q "[.[] | select(.headSha==\"$SHA\" and .status==\"completed\" and .conclusion != \"success\")] | length")
            failed=$((failed + n))
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed image build workflow(s) failed"
            exit 1
          fi

      - name: Install crane
        run: |
          set -euo pipefail
          VER=v0.20.2
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${VER}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag :latest as main-<sha7> for every image
        run: |
          set -euo pipefail
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          IMAGES="devai devai-sre devai-dashboard devai-sre-dashboard devai-auth-bff devai-runner devai-browser devai-mcp-bridge"
          missing=0
          for img in $IMAGES; do
            REPO="${REGISTRY}/${OWNER_REPO}/${img}"
            if crane manifest "${REPO}:latest" >/dev/null 2>&1; then
              echo "tag ${REPO}:latest -> main-${SHA}"
              crane tag "${REPO}:latest" "main-${SHA}"
            else
              echo "::error::missing required image ${REPO}:latest"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/849928263410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
          project_id: tesseracthub-480811

      - name: Copy and verify runtime-critical images in direct GAR
        run: |
          set -euo pipefail
          gcloud auth print-access-token | crane auth login "$GAR_REGISTRY" \
            --username oauth2accesstoken --password-stdin
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DIRECT_GAR_IMAGES="devai-auth-bff devai-mcp-bridge"
          for img in $DIRECT_GAR_IMAGES; do
            source="${REGISTRY}/${OWNER_REPO}/${img}:main-${SHA}"
            target="${GAR_REGISTRY}/${GAR_REPOSITORY}/${img}:main-${SHA}"
            echo "copy $source -> $target"
            crane copy "$source" "$target"
            crane manifest "$target" >/dev/null
          done

      # Only NOW — once every image's main-<sha> tag exists — advance the
      # `deploy` branch to this commit. Kargo's warehouse watches `deploy`, NOT
      # `main`, so it can't promote a commit before its images are pullable. This
      # closes the race where git-discovery promoted instantly, the deploy pods
      # pulled a not-yet-existing tag, and the GAR pull-through negative-cached a
      # 404 that then stuck (ImagePullBackOff that never recovered).
      - name: Advance the deploy marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          # Runs finish out of order — a commit whose ALM image takes 30 min settles
          # after a later dashboard-only commit. Moving the marker backwards then
          # un-deploys the newer commit until someone pushes again.
          CURRENT="$(gh api "repos/${OWNER_REPO}/git/refs/heads/deploy" -q .object.sha 2>/dev/null || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$SHA" ]; then
            STATUS="$(gh api "repos/${OWNER_REPO}/compare/${SHA}...${CURRENT}" -q .status 2>/dev/null || echo unknown)"
            if [ "$STATUS" = "ahead" ]; then
              echo "deploy already at $CURRENT, ahead of $SHA — leaving it"
              exit 0
            fi
          fi
          gh api -X PATCH "repos/${OWNER_REPO}/git/refs/heads/deploy" -f sha="$SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/${OWNER_REPO}/git/refs" -f ref="refs/heads/deploy" -f sha="$SHA" >/dev/null
          echo "deploy -> $SHA (images verified tagged)"

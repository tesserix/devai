name: Release DevAI CLI to Homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from pyproject.toml, for example 0.1.0
        required: true
        type: string
      ref:
        description: Trusted branch or tag to package
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: homebrew-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14-large
            runner_arch: X64
            arch: amd64
          - runner: macos-14
            runner_arch: ARM64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify version and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["version"] != os.environ["VERSION"]:
              raise SystemExit(f"version mismatch: pyproject={project['version']} input={os.environ['VERSION']}")
          PY

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.15.0" .

      - name: Build and smoke-test executable
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name devai \
            --paths src \
            --collect-all devai \
            scripts/devai_cli_entry.py
          codesign --force --deep --sign - dist/devai
          dist/devai --help
          dist/devai auth --help
          archive="devai-${VERSION}-darwin-${ARCH}.tar.gz"
          tar -C dist -czf "$archive" devai
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"

      - name: Upload packaged executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devai-${{ inputs.version }}-darwin-${{ matrix.arch }}
          path: |
            devai-${{ inputs.version }}-darwin-${{ matrix.arch }}.tar.gz
            devai-${{ inputs.version }}-darwin-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and formula
    needs: build
    runs-on: macos-14
    steps:
      - name: Authenticate to GCP with repository-bound workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/849928263410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: devai-homebrew-release@tesseracthub-480811.iam.gserviceaccount.com
          project_id: tesseracthub-480811

      - name: Read GitHub App credentials
        id: app-secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262
        with:
          secrets: |-
            app_id:tesseracthub-480811/prod-devai-github-app-id
            private_key:tesseracthub-480811/prod-devai-github-app-private-key

      - name: Mint a tap-only release token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ steps.app-secrets.outputs.app_id }}
          private-key: ${{ steps.app-secrets.outputs.private_key }}
          owner: tesserix
          repositories: homebrew-tap
          permission-contents: write

      - name: Check out public tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tesserix/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Download packaged executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: devai-${{ inputs.version }}-darwin-*
          merge-multiple: true
          path: release-assets

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="devai-v${VERSION}"
          if gh release view "$tag" --repo tesserix/homebrew-tap >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the DevAI version instead of replacing assets." >&2
            exit 1
          fi
          gh release create "$tag" release-assets/*.tar.gz \
            --repo tesserix/homebrew-tap \
            --title "DevAI CLI ${VERSION}" \
            --notes "Install with: brew tap tesserix/tap && brew install devai"

      - name: Render and install-test formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          amd64_sha="$(tr -d '[:space:]' < "release-assets/devai-${VERSION}-darwin-amd64.tar.gz.sha256")"
          arm64_sha="$(tr -d '[:space:]' < "release-assets/devai-${VERSION}-darwin-arm64.tar.gz.sha256")"
          python tap/scripts/render_devai_formula.py \
            --version "$VERSION" \
            --amd64-sha256 "$amd64_sha" \
            --arm64-sha256 "$arm64_sha" \
            --output tap/Formula/devai.rb
          tap_root="$(brew --repository)/Library/Taps/tesserix/homebrew-tap"
          mkdir -p "$(dirname "$tap_root")"
          ln -s "$PWD/tap" "$tap_root"
          brew style tap/Formula/devai.rb
          brew audit --strict tesserix/tap/devai
          brew install --formula tesserix/tap/devai
          "$(brew --prefix)/bin/devai" --help

      - name: Commit formula update
        env:
          VERSION: ${{ inputs.version }}
        working-directory: tap
        run: |
          git config user.name "devai-gh-app[bot]"
          git config user.email "devai-gh-app[bot]@users.noreply.github.com"
          git add Formula/devai.rb
          git commit -m "chore(devai): update Homebrew formula to ${VERSION}"
          git push origin HEAD:main

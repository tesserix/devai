name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "feature/**", "bugfix/**", "hotfix/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy src/devai/ --ignore-missing-imports

      - name: Test
        run: pytest tests/ -v --tb=short --cov=devai --cov-report=term-missing

name: Agent evaluations

on:
  pull_request:
    branches: [main]
    paths:
      - 'architecture/registry-seeds/agents/**'
      - 'architecture/registry-seeds/prompts/**'
      - 'specializations/**'
      - 'src/devai/agents/**'
      - '.github/workflows/agent-evals.yaml'
  push:
    branches: [main]
    paths:
      - 'architecture/registry-seeds/agents/**'
      - 'architecture/registry-seeds/prompts/**'
      - 'specializations/**'
      - 'src/devai/agents/**'
      - '.github/workflows/agent-evals.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: agent-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  impact:
    name: Resolve impacted Agents
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_evals: ${{ steps.matrix.outputs.has_evals }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install impact resolver dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Resolve evaluation matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          PYTHONPATH=src python -m devai.ci.agent_evals impact \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output impact.json
          echo "matrix=$(jq -c '.evaluations' impact.json)" >> "$GITHUB_OUTPUT"
          echo "has_evals=$(jq -r '(.evaluations | length) > 0' impact.json)" >> "$GITHUB_OUTPUT"
          {
            echo '### Agent evaluation impact'
            echo
            echo '```json'
            cat impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r '.uncovered_agents | length' impact.json)" -gt 0 ]]; then
            echo 'Changed Agents without an owned EvalSuite are not safe to merge.' >&2
            exit 1
          fi

      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-eval-impact
          path: impact.json
          if-no-files-found: error
          retention-days: 30

  live_config:
    name: Detect live evaluation configuration
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    env:
      DEVAI_API_URL: ${{ vars.DEVAI_CI_API_URL }}
      DEVAI_SESSION_COOKIE: ${{ secrets.DEVAI_CI_SESSION_COOKIE }}
      DEVAI_CI_LLM_CONNECTOR: ${{ vars.DEVAI_CI_LLM_CONNECTOR }}
    steps:
      - name: Detect complete owner-scoped configuration
        id: detect
        run: |
          enabled=false
          if [[ -n "$DEVAI_API_URL" && -n "$DEVAI_SESSION_COOKIE" && -n "$DEVAI_CI_LLM_CONNECTOR" ]]; then
            enabled=true
            echo "::add-mask::$DEVAI_SESSION_COOKIE"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" == 'true' ]]; then
            echo 'Live Agent evaluations are configured.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live Agent evaluations are skipped; owner-scoped CI credentials are incomplete.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  evaluate:
    name: Evaluate ${{ matrix.agent }}
    needs: [impact, live_config]
    if: >-
      needs.impact.outputs.has_evals == 'true' &&
      needs.live_config.outputs.enabled == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.outputs.matrix) }}
    env:
      DEVAI_API_URL: ${{ vars.DEVAI_CI_API_URL }}
      DEVAI_SESSION_COOKIE: ${{ secrets.DEVAI_CI_SESSION_COOKIE }}
      DEVAI_CI_LLM_CONNECTOR: ${{ vars.DEVAI_CI_LLM_CONNECTOR }}
      GH_TOKEN: ${{ github.token }}
      RUN_JUDGE: >-
        ${{ github.event_name == 'push' ||
            contains(github.event.pull_request.labels.*.name, 'agent-evals/judge') }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install DevAI
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate owner-scoped CI configuration
        run: |
          test -n "$DEVAI_API_URL" || { echo 'DEVAI_CI_API_URL is required' >&2; exit 1; }
          test -n "$DEVAI_SESSION_COOKIE" || { echo 'DEVAI_CI_SESSION_COOKIE is required' >&2; exit 1; }
          test -n "$DEVAI_CI_LLM_CONNECTOR" || { echo 'DEVAI_CI_LLM_CONNECTOR is required' >&2; exit 1; }
          echo "::add-mask::$DEVAI_SESSION_COOKIE"

      - name: Download current main baseline
        run: |
          mkdir -p baseline-cache
          baseline_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow agent-evals.yaml \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -n "$baseline_run" ]]; then
            gh run download "$baseline_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name agent-eval-baselines \
              --dir baseline-cache || true
          fi

      - name: Create isolated sandbox
        id: sandbox
        env:
          AGENT_PATH: ${{ matrix.agent_path }}
          SUITE_PATH: ${{ matrix.suite_path }}
        run: |
          mkdir -p eval-output
          devai adk sandbox create "$AGENT_PATH" \
            --agent-version "commit-${GITHUB_SHA}" \
            --suite "$SUITE_PATH" \
            --tool-mode mock \
            --llm-connector "$DEVAI_CI_LLM_CONNECTOR" \
            --confirm-llm-connector \
            --output json > eval-output/${{ matrix.agent }}-sandbox.json
          sandbox_id="$(jq -er '.id' eval-output/${{ matrix.agent }}-sandbox.json)"
          echo "sandbox_id=$sandbox_id" >> "$GITHUB_OUTPUT"

      - name: Wait for sandbox readiness
        run: devai adk sandbox wait '${{ steps.sandbox.outputs.sandbox_id }}' --timeout 300 --interval 2

      - name: Evaluate and compare
        id: gate
        env:
          AGENT: ${{ matrix.agent }}
          DATASET_PATH: ${{ matrix.dataset_path }}
          HAS_JUDGE: ${{ matrix.judge }}
          SUITE_PATH: ${{ matrix.suite_path }}
          SANDBOX_ID: ${{ steps.sandbox.outputs.sandbox_id }}
        run: |
          set +e
          if [[ "$HAS_JUDGE" == 'true' && "$RUN_JUDGE" != 'true' ]]; then
            devai adk test "$AGENT" \
              --sandbox-id "$SANDBOX_ID" \
              --dataset "$DATASET_PATH" \
              --json > "eval-output/${AGENT}-candidate.json"
          else
            devai adk test "$AGENT" \
              --sandbox-id "$SANDBOX_ID" \
              --suite "$SUITE_PATH" \
              --json > "eval-output/${AGENT}-candidate.json"
          fi
          eval_status=$?
          set -e

          baseline="baseline-cache/${AGENT}-candidate.json"
          compare_args=(
            compare
            --agent "$AGENT"
            --candidate "eval-output/${AGENT}-candidate.json"
            --output "eval-output/${AGENT}-comparison.json"
            --markdown "eval-output/${AGENT}-comparison.md"
          )
          if [[ -f "$baseline" ]]; then
            compare_args+=(--baseline "$baseline")
          fi
          set +e
          PYTHONPATH=src python -m devai.ci.agent_evals "${compare_args[@]}"
          compare_status=$?
          set -e
          printf 'eval=%s\ncompare=%s\n' "$eval_status" "$compare_status" \
            > "eval-output/${AGENT}-status.txt"
          if [[ "$eval_status" -ne 0 || "$compare_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Destroy isolated sandbox
        if: always() && steps.sandbox.outputs.sandbox_id != ''
        run: devai adk sandbox destroy '${{ steps.sandbox.outputs.sandbox_id }}'

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-eval-${{ matrix.agent }}
          path: eval-output/
          if-no-files-found: warn
          retention-days: 30

  scorecard:
    name: Agent evaluation scorecard
    needs: [impact, live_config, evaluate]
    if: >-
      always() && needs.impact.outputs.has_evals == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download candidate evidence
        if: needs.live_config.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-eval-*
          path: scorecards
          merge-multiple: true

      - name: Build consolidated scorecard
        id: scorecard
        env:
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          LIVE_EVALS_ENABLED: ${{ needs.live_config.outputs.enabled }}
        run: |
          {
            echo '<!-- devai-agent-evals -->'
            echo '## DevAI Agent evaluation scorecard'
            echo
            if [[ "$LIVE_EVALS_ENABLED" == 'true' ]]; then
              find scorecards -name '*-comparison.md' -type f -print0 \
                | sort -z \
                | xargs -0 -r cat
            else
              echo '> Live evaluations skipped because owner-scoped CI credentials are not configured. Artifact ownership validation passed.'
            fi
          } > scorecard.md
          failed=false
          if [[ "$LIVE_EVALS_ENABLED" == 'true' && "$EVALUATE_RESULT" != 'success' ]]; then
            failed=true
            {
              echo
              echo '> One or more Agent evaluations failed or did not produce complete evidence.'
            } >> scorecard.md
          fi
          while IFS= read -r -d '' comparison; do
            if jq -e '.status == "regressed"' "$comparison" >/dev/null; then
              failed=true
            fi
          done < <(find scorecards -name '*-comparison.json' -type f -print0)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update PR scorecard comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n --rawfile body scorecard.md '{body: $body}' > scorecard-request.json
          comment_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- devai-agent-evals -->")) | .id' \
            | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input scorecard-request.json >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input scorecard-request.json >/dev/null
          fi

      - name: Assemble successful main baseline set
        if: github.event_name == 'push' && needs.evaluate.result == 'success'
        run: |
          mkdir -p baseline-output
          previous_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow agent-evals.yaml \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" \
              --repo "$GITHUB_REPOSITORY" \
              --name agent-eval-baselines \
              --dir baseline-output || true
          fi
          find scorecards -name '*-candidate.json' -type f \
            -exec cp {} baseline-output/ \;

      - name: Store successful main scorecards as baselines
        if: github.event_name == 'push' && needs.evaluate.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-eval-baselines
          path: baseline-output/*-candidate.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce evaluation gate
        if: steps.scorecard.outputs.failed == 'true'
        run: exit 1

name: gitops_auditor
display_name: GitOps Auditor
description: >-
  Read-only GitOps hygiene sweep across all three controllers. Finds Argo
  CD apps OutOfSync/Degraded or stuck mid-operation, Flux objects that are
  suspended, not Ready, or pinned to stale revisions, failing Flux sources,
  and Kargo stages with failed promotions or freight that stopped flowing.
  Issues no mutations — it reports drift with evidence so the responder or
  a human can act.
category: sre

llm_provider: groq
llm_model: llama-3.3-70b-versatile

allowed_tools:
  - argocd_list_apps
  - argocd_get_app
  - argocd_app_history
  - flux_list_kustomizations
  - flux_list_helmreleases
  - flux_list_sources
  - flux_get_object
  - kargo_list_projects
  - kargo_list_stages
  - kargo_list_promotions

max_turns: 20
timeout: 10m

context_keys:
  - discovery_output

output_key: gitops_auditor_output

handover_schema:
  findings:
    type: array
    required: true
    description: >-
      Each {controller: argocd|flux|kargo, target, severity: critical|high|medium|low,
      kind: out_of_sync|degraded|stuck_operation|suspended|not_ready|source_failing|
      promotion_failed|freight_stalled, evidence, recommendation}.
  healthy_count:
    type: integer
    required: true
    description: Targets inspected that are fully healthy.
  summary:
    type: string
    required: true

risk_level: low
role_color: admin

system_prompt: |
  You are a GitOps Auditor — a read-only hygiene sweep over the delivery plane.
  You inspect, you never mutate.

  What "wrong" looks like per controller:
  - **Argo CD**: sync_status=OutOfSync (drift between Git and cluster — fine for minutes,
    a finding after that), health Degraded/Missing, an operation_phase stuck in Running,
    or repeated rollbacks in history (flapping).
  - **Flux**: suspended=true (someone froze it and may have forgotten), Ready=False
    (read the condition message — distinguish source failures from apply failures),
    sources not Ready (a failing GitRepository silently blocks every dependent object).
  - **Kargo**: promotions with phase Failed/Errored, stages whose current freight is much
    older than the newest warehouse freight (the pipeline stalled), stages Unhealthy.

  Process: list everything for each controller, drill into anything abnormal with the
  get/detail tools, and grade severity by blast radius (prod-facing > staging; a failing
  source affecting many objects > one degraded app). Quote the actual condition/operation
  message as evidence — never paraphrase into vagueness.

  Output ONLY valid JSON matching the handover schema.

metadata:
  owner: sre-team
  status: yaml_only

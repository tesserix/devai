name: product_director
display_name: Product Director
description: >-
  Turn analyzed requirements into a GitHub Epic plus a list of user
  stories. Each story has acceptance criteria, priority, labels, and is
  sized for 1-3 days of work.
category: planning

llm_provider: openai
llm_model: o3
temperature: 0.4

allowed_tools:
  - scm_create_issue
  - scm_get_repo_tree
  - scm_list_files

max_turns: 35
timeout: 15m

context_keys:
  - requirements_analyst_output
  - tech_detector_output
  - skill_profile_name

output_key: product_director_output

handover_schema:
  epic_issue_number:
    type: integer
    required: true
    description: GitHub issue number of the created Epic.
  stories:
    type: array
    required: true
    description: Each item has {number, title, description, acceptance_criteria, priority, labels}.
  story_issue_numbers:
    type: array
    required: true
    description: Just the issue numbers from `stories` — convenience handover.

risk_level: medium
role_color: product

legacy_python_class: devai.agents.product_director.ProductDirectorAgent

system_prompt: |
  You are a Senior Product Director at a world-class software company.

  PHASE 1 — Create a GitHub Epic from analyzed requirements:

  An Epic is a large body of work that groups multiple user stories.

  Output ONLY valid JSON for the Epic:
  {
      "title": "Epic title — concise and descriptive",
      "description": "Detailed epic description with context, goals, and scope",
      "labels": ["epic", "feature-area"],
      "milestones": ["key milestone 1", "key milestone 2"]
  }

  PHASE 2 — Break down the epic into well-structured user stories.

  Output ONLY valid JSON — an array of user story objects:
  [
    {
      "title": "User story title",
      "description": "As a [user type], I want [goal] so that [benefit].\n\nContext: ...",
      "acceptance_criteria": ["Given X, when Y, then Z", ...],
      "priority": "high",
      "labels": ["feature", "frontend"]
    }
  ]

  Guidelines:
  - Each story should be independently deliverable
  - Stories should be small enough for 1-3 days of work
  - Acceptance criteria must be specific and testable
  - Include edge cases and error scenarios
  - Use "As a [user], I want [goal], so that [benefit]" format

metadata:
  owner: alm-team
  fiber_parity: product_manager

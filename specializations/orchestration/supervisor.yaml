name: supervisor
display_name: Supervisor Architect
description: >-
  Senior technical architect that plans the run before execution starts.
  Reviews requirements + repo + memory + governance, produces a
  delegation plan (which roles run, in what order, with what depends_on).
  The orchestrator_pre stage hands off to it.
category: orchestration

llm_provider: openai
llm_model: o3
temperature: 0.3

allowed_tools:
  - scm_get_repo_tree
  - scm_get_file_content
  - scm_create_issue
  - scm_create_project_v2

max_turns: 30
timeout: 10m

context_keys:
  - requirements
  - tech_detector_output
  - skill_profile_name
  - memory_context
  - governance

output_key: supervisor_output

handover_schema:
  delegation_plan:
    type: object
    required: true
    description: Roles, dependencies, estimated complexity per role.
  tracking_issue:
    type: integer
    required: false
    description: GitHub issue number for the supervisor's tracking thread.
  project_id:
    type: string
    required: false
    description: GitHub Projects v2 node ID for the run.
  summary:
    type: string
    required: true

risk_level: low
role_color: admin

legacy_python_class: devai.agents.supervisor.SupervisorAgent

system_prompt: |
  You are the Supervisor Agent — the senior technical architect and team lead for an AI-powered software development pipeline.

  Your responsibilities before any code is written:
  1. Read and absorb the user's requirements, the repository's CLAUDE.md / governance docs, the tech_detector output, and any memory from past runs on this repo.
  2. Produce a delegation plan that names every role that will run, in what order, and with what dependencies.
  3. Create a tracking issue on the repo summarizing the plan so humans can follow along.
  4. (Optional) Create a GitHub Projects v2 board where each story becomes a card.

  Rules:
  - Don't write code or modify files. You plan; others execute.
  - The plan must include risk_level for each role (low/medium/high/critical).
  - Flag any requirement that's ambiguous or contradicts governance — the user fixes this before code starts.

  Output ONLY valid JSON:
  {
      "delegation_plan": {
          "roles": [
              {"name": "requirements_analyst", "risk_level": "low", "depends_on": []},
              {"name": "product_director", "risk_level": "medium", "depends_on": ["requirements_analyst"]},
              ...
          ]
      },
      "tracking_issue": 42,
      "project_id": "PVT_kw...",
      "summary": "Brief one-paragraph plan summary"
  }

metadata:
  owner: alm-team
  fiber_parity: requirements_engineer

name: qa_tester
display_name: Senior QA Engineer
description: >-
  Write and run E2E tests for the implemented story. Verifies acceptance
  criteria pass against the real running app (when a preview is up) or
  the deployed branch. Loops back to senior_developer on test failures.
category: review

llm_provider: claude
llm_model: claude-sonnet-4-20250514
max_tokens: 8192

allowed_tools:
  - scm_get_file_content
  - scm_commit_file
  - run_playwright_test
  - validate_e2e_cypress
  - validate_unit_tests

max_turns: 80
timeout: 20m

context_keys:
  - senior_developer_output
  - product_director_output
  - skill_profile_name

output_key: qa_tester_output

handover_schema:
  test_total:
    type: integer
    required: true
  test_passed:
    type: integer
    required: true
  test_failed:
    type: integer
    required: true
  test_summary:
    type: string
    required: true
  test_failures:
    type: array
    required: false
    description: Each item {test, file, error, suggestion}.

risk_level: medium
role_color: qa

legacy_python_class: devai.agents.qa_tester.QATesterAgent

system_prompt: |
  You are a Senior QA Engineer responsible for writing and running E2E tests.

  Your job is to verify the story's acceptance criteria are actually met by the
  implementation. You write tests that drive the real application (browser for
  web apps, HTTP for APIs), not unit tests of internal functions.

  Process:
  1. Read the story's acceptance criteria from the product_director_output
  2. Read the senior_developer's implementation_summary
  3. Identify which acceptance criteria need E2E coverage
  4. Write Playwright (for web) or HTTP test suites (for APIs) that exercise the criteria
  5. Run the tests using the appropriate validate_e2e_* tool
  6. Report results

  Rules:
  - Test the BEHAVIOR described in acceptance criteria, not implementation details
  - Each test must fail meaningfully — assertion messages should explain what went wrong
  - Use the existing test setup if one exists (don't reinvent fixtures)
  - When a test fails, report the test name, file, error, and a suggested fix

  Output ONLY valid JSON:
  {
      "total": 12,
      "passed": 11,
      "failed": 1,
      "summary": "11/12 passed — login redirect missing",
      "failures": [
          {
              "test": "user can log in",
              "file": "tests/auth.spec.ts",
              "error": "Expected redirect to /dashboard, got /login",
              "suggestion": "Check the login route handler — redirect logic may be missing"
          }
      ]
  }

metadata:
  owner: alm-team
  fiber_parity: quality_analyst

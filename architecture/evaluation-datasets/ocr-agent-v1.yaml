    artifact: {ref: 'eval-artifact://ocr-agent/v1/receipts/mobile-001', digest: 'sha256:2222222222222222222222222222222222222222222222222222222222222222', media_type: image/jpeg, provenance: synthetic, review_status: approved, redacted: false}

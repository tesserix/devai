name: ocr-agent-golden
version: '1'
description: Product-neutral synthetic compatibility cases for the reusable document agent and extract_document tool.
cases:
  - id: invoice-clean
    input: Extract the structured invoice fields from upload upl_EVAL_INVOICE and cite every returned value.
    expected_json_schema: &result_schema
      type: object
      additionalProperties: false
      properties:
        job_id: {type: string, pattern: '^job_[A-Za-z0-9_]{1,64}$'}
        status: {type: string, enum: [completed, partial, review_required]}
        content_trust: {const: untrusted}
        citations: {type: array, minItems: 1}
      required: [job_id, status, content_trust, citations]
    expected_tools: [extract_document]
    forbidden_tools: [shell_exec, send_email]
    expected_tool_arguments:
      - upload_id: upl_EVAL_INVOICE
        document_type: invoice
        output_format: structured
        include_evidence: true
    max_total_tokens: 4000
    max_latency_ms: 120000
    max_cost_usd: 0.25
    artifact: {ref: 'eval-artifact://ocr-agent/v1/invoices/clean-001', digest: 'sha256:1111111111111111111111111111111111111111111111111111111111111111', media_type: application/pdf, provenance: synthetic, review_status: approved, redacted: false}
    tags: [invoice, clean, english]


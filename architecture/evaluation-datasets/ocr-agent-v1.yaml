  - id: poor-quality-reject
    input: Assess and extract upload upl_EVAL_POOR_SCAN without hiding unusable image quality.
    expected_json_schema:
      type: object
      additionalProperties: false
      properties:
        job_id: {type: string, pattern: '^job_[A-Za-z0-9_]{1,64}$'}
        status: {const: rejected}
        content_trust: {const: untrusted}
        warnings: {type: array, minItems: 1}
        validation_failures: {type: array}
      required: [job_id, status, content_trust, warnings, validation_failures]
    expected_tools: [extract_document]
    forbidden_tools: [shell_exec, send_email]
    expected_tool_arguments:
      - upload_id: upl_EVAL_POOR_SCAN
        document_type: auto
        output_format: structured
        include_evidence: true
    max_total_tokens: 4000
    max_latency_ms: 120000
    max_cost_usd: 0.25
    ocr:
      acceptable_statuses: [rejected]
      require_citations: false
    artifact: {ref: 'eval-artifact://ocr-agent/v1/poor-quality-scans/blur-001', digest: 'sha256:4444444444444444444444444444444444444444444444444444444444444444', media_type: image/webp, provenance: synthetic, review_status: approved, redacted: false}
    tags: [poor-quality-scan, blur, quality-gate]

  - id: mixed-language
    input: Extract upload upl_EVAL_MIXED_LANGUAGE in its detected scripts with evidence and no unsupported translation.
    expected_json_schema: *result_schema
    expected_tools: [extract_document]
    forbidden_tools: [shell_exec, send_email]
    expected_tool_arguments:
      - upload_id: upl_EVAL_MIXED_LANGUAGE
        document_type: general
        output_format: structured
        include_evidence: true
        language_hints: [en, hi]
    max_total_tokens: 5000
    max_latency_ms: 120000
    max_cost_usd: 0.3
    ocr: *successful_ocr
    artifact: {ref: 'eval-artifact://ocr-agent/v1/mixed-language/en-hi-001', digest: 'sha256:5555555555555555555555555555555555555555555555555555555555555555', media_type: application/pdf, provenance: synthetic, review_status: approved, redacted: false}
    tags: [mixed-language, english, hindi]


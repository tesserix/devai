        output_format: structured
        include_evidence: true
    max_total_tokens: 4000
    max_latency_ms: 120000
    max_cost_usd: 0.25
    ocr: *successful_ocr
    artifact: {ref: 'eval-artifact://ocr-agent/v1/receipts/mobile-001', digest: 'sha256:2222222222222222222222222222222222222222222222222222222222222222', media_type: image/jpeg, provenance: synthetic, review_status: approved, redacted: false}
    tags: [receipt, mobile-photo, english]

  - id: handwriting-review
    input: Read upload upl_EVAL_HANDWRITING, preserve uncertainty, and route low-confidence content for review.
    expected_json_schema: *result_schema
    expected_tools: [extract_document]
    forbidden_tools: [shell_exec, send_email]
    expected_tool_arguments:
      - upload_id: upl_EVAL_HANDWRITING

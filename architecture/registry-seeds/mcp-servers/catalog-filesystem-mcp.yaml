apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-filesystem-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: files
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: none
    mcp.devai.io/native: stdio
spec:
  name: catalog-filesystem-mcp
  displayName: Filesystem
  description: "Read/write files in a sandboxed workspace \u2014 drafts and generated artifacts."
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/filesystem
  transport: streamable-http
  authMode: none
  catalog: true
  connect:
    authKind: none
    native: stdio
    credential: none (sandboxed to the bridge workdir)
    docs: https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem
  stdio:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /workspace

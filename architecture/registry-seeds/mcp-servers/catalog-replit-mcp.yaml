apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-replit-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: devops
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-replit-mcp
  displayName: Replit
  description: Build, run and deploy apps on Replit.
  endpoint: https://mcp.replit.com/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Replit OAuth
    docs: https://docs.replit.com

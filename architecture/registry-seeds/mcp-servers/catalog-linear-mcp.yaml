apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-linear-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: ticketing
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-linear-mcp
  displayName: Linear
  description: Linear issues, projects, cycles and triage.
  endpoint: https://mcp.linear.app/sse
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Linear OAuth
    docs: https://linear.app/docs/mcp

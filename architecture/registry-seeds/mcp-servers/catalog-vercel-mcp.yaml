apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-vercel-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: devops
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-vercel-mcp
  displayName: Vercel
  description: Deployments, projects, environments and logs on Vercel.
  endpoint: https://mcp.vercel.com
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Vercel OAuth
    docs: https://vercel.com/docs/mcp

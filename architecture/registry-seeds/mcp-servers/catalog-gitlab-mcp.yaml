apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-gitlab-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: scm
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: env
    mcp.devai.io/native: stdio
spec:
  name: catalog-gitlab-mcp
  displayName: GitLab
  description: GitLab projects, issues, merge requests and files.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/gitlab
  transport: streamable-http
  authMode: env
  catalog: true
  connect:
    authKind: env
    native: stdio
    credential: GitLab PAT
    docs: https://www.npmjs.com/package/@modelcontextprotocol/server-gitlab
  stdio:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-gitlab'
    env:
      GITLAB_PERSONAL_ACCESS_TOKEN: '{secret}'
      GITLAB_API_URL: '{prefs:api_url}'

apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-drawio-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: design
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: none
    mcp.devai.io/native: stdio
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-drawio-mcp
  displayName: draw.io / diagrams
  description: "Create and edit draw.io diagrams \u2014 shapes, flows, architecture."
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/drawio
  transport: streamable-http
  authMode: none
  catalog: true
  connect:
    authKind: none
    native: stdio
    credential: none
    docs: https://github.com/lgazo/drawio-mcp-server
  stdio:
    command: npx
    args:
    - -y
    - drawio-mcp-server

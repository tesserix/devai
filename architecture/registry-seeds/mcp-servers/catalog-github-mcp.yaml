apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-github-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: scm
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-github-mcp
  displayName: GitHub
  description: "GitHub's official remote MCP \u2014 repos, issues, PRs, Actions, code search."
  endpoint: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: GitHub OAuth (or a fine-grained PAT in token mode)
    docs: https://github.com/github/github-mcp-server

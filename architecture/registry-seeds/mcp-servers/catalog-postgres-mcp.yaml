apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-postgres-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: database
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: env
    mcp.devai.io/native: stdio
spec:
  name: catalog-postgres-mcp
  displayName: PostgreSQL
  description: "Read-only SQL \u2014 schema introspection and queries over your database."
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/postgres
  transport: streamable-http
  authMode: env
  catalog: true
  connect:
    authKind: env
    native: stdio
    credential: Postgres connection string
    docs: https://github.com/modelcontextprotocol/servers/tree/main/src/postgres
  stdio:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-postgres'
    env:
      DATABASE_URL: '{secret}'

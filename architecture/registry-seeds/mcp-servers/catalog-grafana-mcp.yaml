apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-grafana-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: observability
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: token
    mcp.devai.io/native: http
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-grafana-mcp
  displayName: Grafana
  description: Dashboards, datasources, alerts and Loki/Prometheus queries.
  endpoint: https://mcp.grafana.com/mcp
  transport: streamable-http
  authMode: header
  catalog: true
  connect:
    authKind: token
    native: http
    credential: Grafana service-account token
    docs: https://github.com/grafana/mcp-grafana

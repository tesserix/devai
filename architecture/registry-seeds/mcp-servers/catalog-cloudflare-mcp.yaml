apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-cloudflare-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: devops
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-cloudflare-mcp
  displayName: Cloudflare
  description: Workers, DNS, R2, KV and Cloudflare docs.
  endpoint: https://docs.mcp.cloudflare.com/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Cloudflare OAuth
    docs: https://developers.cloudflare.com/agents/model-context-protocol/

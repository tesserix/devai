apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-intercom-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: support
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-intercom-mcp
  displayName: Intercom
  description: Look up conversations, tickets and customer context in Intercom.
  endpoint: https://mcp.intercom.com/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Intercom OAuth
    docs: https://developers.intercom.com

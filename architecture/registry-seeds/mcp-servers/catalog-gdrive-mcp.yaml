apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-gdrive-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: files
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: stdio
spec:
  name: catalog-gdrive-mcp
  displayName: Google Drive
  description: Search and read Google Docs, Sheets and Slides.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/gdrive
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: stdio
    credential: Google OAuth
    docs: https://github.com/modelcontextprotocol/servers/tree/main/src/gdrive
  stdio:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-gdrive'

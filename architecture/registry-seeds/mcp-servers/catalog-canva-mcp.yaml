apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-canva-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: design
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-canva-mcp
  displayName: Canva
  description: "Search, create and edit Canva designs \u2014 posts, slides, brand assets."
  endpoint: https://mcp.canva.com/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Canva OAuth
    docs: https://www.canva.dev/docs/apps/mcp/

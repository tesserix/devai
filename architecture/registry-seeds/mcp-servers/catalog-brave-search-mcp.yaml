apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-brave-search-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: search
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: env
    mcp.devai.io/native: stdio
spec:
  name: catalog-brave-search-mcp
  displayName: Brave Search
  description: Web and local search via the Brave Search API.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/brave-search
  transport: streamable-http
  authMode: env
  catalog: true
  connect:
    authKind: env
    native: stdio
    credential: Brave Search API key
    docs: https://github.com/modelcontextprotocol/servers/tree/main/src/brave-search
  stdio:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-brave-search'
    env:
      BRAVE_API_KEY: '{secret}'

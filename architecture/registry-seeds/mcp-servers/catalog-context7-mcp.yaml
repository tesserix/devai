apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-context7-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: docs
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: token
    mcp.devai.io/native: http
spec:
  name: catalog-context7-mcp
  displayName: Context7 (library docs)
  description: Up-to-date, version-specific documentation for any library, on demand.
  endpoint: https://mcp.context7.com/mcp
  transport: streamable-http
  authMode: header
  catalog: true
  connect:
    authKind: token
    native: http
    credential: Context7 API key (free tier)
    docs: https://context7.com

apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-figma-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: design
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: env
    mcp.devai.io/native: stdio
spec:
  name: catalog-figma-mcp
  displayName: Figma
  description: Read Figma files, frames and design tokens; turn designs into code.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/figma
  transport: streamable-http
  authMode: env
  catalog: true
  connect:
    authKind: env
    native: stdio
    credential: Figma personal access token
    docs: https://github.com/GLips/Figma-Context-MCP
  stdio:
    command: npx
    args:
    - -y
    - figma-developer-mcp
    env:
      FIGMA_API_KEY: '{secret}'

apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-excalidraw-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: design
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: none
    mcp.devai.io/native: stdio
spec:
  name: catalog-excalidraw-mcp
  displayName: Excalidraw
  description: Hand-drawn-style diagrams and whiteboards via Excalidraw.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/excalidraw
  transport: streamable-http
  authMode: none
  catalog: true
  connect:
    authKind: none
    native: stdio
    credential: none
    docs: https://github.com/yctimlin/mcp_excalidraw
  stdio:
    command: npx
    args:
    - -y
    - excalidraw-mcp

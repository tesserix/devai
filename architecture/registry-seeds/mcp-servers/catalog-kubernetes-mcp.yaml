apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-kubernetes-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: devops
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: none
    mcp.devai.io/native: stdio
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-kubernetes-mcp
  displayName: Kubernetes (read)
  description: Inspect pods, deployments, services and events in a cluster.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/kubernetes
  transport: streamable-http
  authMode: none
  catalog: true
  connect:
    authKind: none
    native: stdio
    credential: none
    docs: https://github.com/Flux159/mcp-server-kubernetes
  stdio:
    command: npx
    args:
    - -y
    - mcp-server-kubernetes

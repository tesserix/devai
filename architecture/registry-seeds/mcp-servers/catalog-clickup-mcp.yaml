apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-clickup-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: ticketing
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: token
    mcp.devai.io/native: http
spec:
  name: catalog-clickup-mcp
  displayName: ClickUp
  description: ClickUp tasks, docs and spaces.
  endpoint: https://mcp.clickup.com/mcp
  transport: streamable-http
  authMode: header
  catalog: true
  connect:
    authKind: token
    native: http
    credential: ClickUp API token
    docs: https://clickup.com

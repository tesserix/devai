apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-asana-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: ticketing
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-asana-mcp
  displayName: Asana
  description: "Asana tasks, projects and portfolios \u2014 turn chats into actions."
  endpoint: https://mcp.asana.com/sse
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Asana OAuth
    docs: https://developers.asana.com/docs/mcp-server

apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: devai-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: lifecycle
    mcp.devai.io/catalog: 'true'
spec:
  name: devai-mcp
  displayName: DevAI Pipeline MCP
  description: "Pipeline lifecycle tools \u2014 dispatch tasks, query runs, list blueprints / specializations.\
    \ Same surface the chat agent exposes via tools today."
  endpoint: http://devai-api.devai.svc.cluster.local:8080/mcp/devai
  serviceSelector:
    namespaces:
      matchLabels:
        kubernetes.io/metadata.name: devai
    services:
      matchLabels:
        mcp.tesserix.app/server: devai-mcp
  authMode: jwt
  catalog: true
  tools:
  - devai_pipeline_dispatch
  - devai_pipeline_list_runs
  - devai_pipeline_get_run
  - devai_pipeline_list_blueprints
  - devai_pipeline_list_stages
  - devai_specializations_list
  - devai_specializations_get
  toolSelector:
    matchLabels:
      mcp.devai.io/server: devai-mcp

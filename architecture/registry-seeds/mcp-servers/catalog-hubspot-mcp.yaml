apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-hubspot-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: crm
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-hubspot-mcp
  displayName: HubSpot
  description: "HubSpot CRM \u2014 contacts, deals, companies and engagements."
  endpoint: https://mcp.hubspot.com/anthropic
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: HubSpot OAuth
    docs: https://developers.hubspot.com/mcp

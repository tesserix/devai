apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-box-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: files
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-box-mcp
  displayName: Box
  description: Securely search and read Box content.
  endpoint: https://mcp.box.com/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Box OAuth
    docs: https://developer.box.com

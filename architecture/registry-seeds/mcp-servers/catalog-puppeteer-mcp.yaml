apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-puppeteer-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: testing
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: none
    mcp.devai.io/native: stdio
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-puppeteer-mcp
  displayName: Puppeteer (browser)
  description: Headless Chromium automation and screenshots.
  endpoint: http://devai-mcp-bridge.devai.svc.cluster.local:8099/bridge/puppeteer
  transport: streamable-http
  authMode: none
  catalog: true
  connect:
    authKind: none
    native: stdio
    credential: none
    docs: https://github.com/modelcontextprotocol/servers/tree/main/src/puppeteer
  stdio:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-puppeteer'

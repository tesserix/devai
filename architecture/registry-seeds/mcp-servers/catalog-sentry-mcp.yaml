apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-sentry-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: observability
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
    mcp.tesserix.app/class: directory
    mcp.tesserix.app/protocol-status: unverified
spec:
  name: catalog-sentry-mcp
  displayName: Sentry
  description: Issues, events, traces and release health from Sentry.
  endpoint: https://mcp.sentry.dev/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: Sentry OAuth
    docs: https://docs.sentry.io/product/sentry-mcp/

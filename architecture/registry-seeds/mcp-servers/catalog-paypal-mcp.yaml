apiVersion: registry.solo.io/v1alpha1
kind: MCPServer
metadata:
  name: catalog-paypal-mcp
  namespace: devai
  visibility: public
  labels:
    devai.io/source: catalog
    devai.io/category: payments
    mcp.devai.io/catalog: 'true'
    mcp.devai.io/auth-kind: oauth
    mcp.devai.io/native: http
spec:
  name: catalog-paypal-mcp
  displayName: PayPal
  description: PayPal orders, payments and disputes.
  endpoint: https://mcp.paypal.com/mcp
  transport: streamable-http
  authMode: oauth
  catalog: true
  connect:
    authKind: oauth
    native: http
    credential: PayPal OAuth
    docs: https://developer.paypal.com

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: discovery-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.0
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: discovery
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: SRE Discovery Agent
  description: First agent in every SRE sweep. Auto-discovers all K8s namespaces, services, deployments,
    and dependencies. Maps the topology and stores it as semantic memory for downstream SRE agents.
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/discovery
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - discovery
  prompts:
  - discovery-prompt-v1
  promptRef: discovery-prompt-v1

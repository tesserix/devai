apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: discovery-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: discovery
spec:
  skill: discovery
  promptRef: discovery-prompt-v1
  llm:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    maxTokens: null
  limits:
    maxTurns: 30
    timeoutSeconds: 900
  runtime:
    kind: python_class
    pythonClass: devai.sre.agents.discovery_agent.DiscoveryAgent
  riskLevel: low
  roleColor: admin

apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: engineering-manager-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: planning
    devai.io/skill: engineering-manager
spec:
  skill: engineering-manager
  promptRef: engineering-manager-prompt-v1
  llm:
    provider: claude
    model: claude-sonnet-4-20250514
    temperature: null
    maxTokens: 8192
  limits:
    maxTurns: 60
    timeoutSeconds: 900
  runtime:
    kind: python_class
    pythonClass: devai.agents.engineering_manager.EngineeringManagerAgent
  riskLevel: medium
  roleColor: engineer

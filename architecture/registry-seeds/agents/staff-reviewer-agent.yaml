apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: staff-reviewer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.3
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: review
    devai.io/skill: staff-reviewer
    devai.io/risk-level: medium
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Staff Code Reviewer
  description: 'Final review gate before merge. Checks: code quality, story completeness against acceptance
    criteria, scope (no creep), performance, security, error handling, testability. Loops up to 3 iterations
    on changes_requested then escalates to human.'
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 80
    timeoutSeconds: 900
  riskLevel: medium
  evalSuite:
    ref: staff-reviewer-golden-suite
    version: '1'
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/staff-reviewer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - staff-reviewer
  prompts:
  - staff-reviewer-prompt-v1
  promptRef: staff-reviewer-prompt-v1

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: qa-tester-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: review
    devai.io/skill: qa-tester
    devai.io/risk-level: medium
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Senior QA Engineer
  description: Write and run E2E tests for the implemented story. Verifies acceptance criteria pass against
    the real running app (when a preview is up) or the deployed branch. Loops back to senior_developer
    on test failures.
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/qa-tester
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - qa-tester
  prompts:
  - qa-tester-prompt-v1
  promptRef: qa-tester-prompt-v1

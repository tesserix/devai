apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: incident-responder-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: incident-responder
spec:
  skill: incident-responder
  promptRef: incident-responder-prompt-v1
  llm:
    provider: claude
    model: claude-sonnet-4-20250514
    temperature: null
    maxTokens: null
  limits:
    maxTurns: 30
    timeoutSeconds: 900
  runtime:
    kind: python_class
    pythonClass: devai.sre.agents.incident_responder.IncidentResponderAgent
  riskLevel: high
  roleColor: admin

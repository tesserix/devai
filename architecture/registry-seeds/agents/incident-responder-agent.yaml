apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: incident-responder-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.3
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: incident-responder
    devai.io/risk-level: high
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Incident Responder
  description: Final SRE stage. Reads correlated findings from the parallel monitor fan-out and decides
    whether to create an incident, remediate automatically (where safe), or escalate to a human via PagerDuty/Slack.
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 30
    timeoutSeconds: 600
  riskLevel: high
  evalSuite:
    ref: incident-responder-golden-suite
    version: '1'
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/incident-responder
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - incident-responder
  prompts:
  - incident-responder-prompt-v1
  promptRef: incident-responder-prompt-v1

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: cost-analyzer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: cost-analyzer
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Cost Analyzer
  description: 'Reads GCP billing + cluster resource requests/limits and surfaces cost-savings opportunities:
    oversized requests, idle deployments, unused PVCs, expensive regions, prod-class hardware running
    dev workloads.'
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/cost-analyzer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - cost-analyzer
  prompts:
  - cost-analyzer-prompt-v1
  promptRef: cost-analyzer-prompt-v1

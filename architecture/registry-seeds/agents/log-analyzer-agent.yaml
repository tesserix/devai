apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: log-analyzer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.0
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: log-analyzer
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Log Analyzer
  description: Scans recent logs from every app for error spikes, exception patterns, and security signals
    (auth failures, scrapers, port scans). Correlates timestamps with metric anomalies from perf_monitor.
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/log-analyzer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - id: log-analyzer
    name: Log Analyzer
    description: Scans recent logs from every app for error spikes, exception patterns, and security signals
      (auth failures, scrapers, port scans). Correlates timestamps with metric anomalies from perf_monitor.
    tags:
    - sre
    - low
    - devai

apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: document-analyzer-agent
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: planning
    devai.io/skill: document-analyzer
    # kagent test target: marks this agent long-lived so kagent-agent-sync
    # reconciles it into a controller-managed Deployment, and the dispatcher
    # routes it over A2A WHEN the kagent switch is on (Settings → kagent, or
    # DEVAI_KAGENT_ENABLED). With the switch off it runs as a Job exactly as
    # before — the label alone changes nothing in the DevAI pipeline.
    devai.io/runtime: kagent
spec:
  skill: document-analyzer
  promptRef: document-analyzer-prompt-v1
  # systemPrompt is what the kagent export renders into the kagent Agent CR's
  # spec.systemMessage (kagent requires it to be non-empty). The DevAI Job/inline
  # path ignores it — there the python_class above drives the agent — so this only
  # shapes how the agent behaves when it runs inside kagent.
  systemPrompt: >-
    You are DevAI's Document Analyzer. Given requirement documents, an issue, or a
    PR description, extract the key functional and non-functional requirements,
    constraints, and acceptance criteria, and summarize them concisely for the
    downstream planning agents. Be precise; never invent requirements that are not
    stated in the source.
  llm:
    provider: gemini
    model: gemini-3.1-pro-preview
    temperature: null
    maxTokens: null
  limits:
    maxTurns: 30
    timeoutSeconds: 900
  runtime:
    kind: python_class
    pythonClass: devai.agents.document_analyzer.DocumentAnalyzerAgent
  riskLevel: low
  roleColor: product

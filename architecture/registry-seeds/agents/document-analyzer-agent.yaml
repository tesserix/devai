apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: document-analyzer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: planning
    devai.io/skill: document-analyzer
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Document Analyzer
  description: Ingest PDFs, URLs, OpenAPI specs, architecture diagrams. Extract every functional + non-functional
    requirement, plus any tech-stack hints buried in the input. Output is consumed by requirements_analyst.
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/document-analyzer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - document-analyzer
  prompts:
  - document-analyzer-prompt-v1
  promptRef: document-analyzer-prompt-v1

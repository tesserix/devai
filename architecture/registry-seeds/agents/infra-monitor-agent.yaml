apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: infra-monitor-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.0
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: infra-monitor
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Infrastructure Monitor
  description: 'Checks cluster-level health: node readiness, pod CrashLoopBackOff, flapping deployments,
    restart counts, OOMKills, PVC pressure. Outputs findings consumed by the correlate stage.'
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/infra-monitor
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - infra-monitor
  prompts:
  - infra-monitor-prompt-v1
  promptRef: infra-monitor-prompt-v1

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: deployment-engineer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: orchestration
    devai.io/skill: deployment-engineer
    devai.io/risk-level: high
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Deployment Engineer
  description: 'GitOps deployment specialist. Owns the moment between "merged" and "serving traffic":
    verifies the Argo CD app (or Flux Kustomization/ HelmRelease) picked up the new revision, watches
    sync + health converge, diagnoses stuck or degraded rollouts from controller conditions, and rolls
    back when the new revision cannot become healthy. Fluent in both Argo CD and Flux semantics.'
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 30
    timeoutSeconds: 1200
  riskLevel: high
  evalSuite:
    ref: deployment-engineer-golden-suite
    version: '1'
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/deployment-engineer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - deployment-engineer
  prompts:
  - deployment-engineer-prompt-v1
  promptRef: deployment-engineer-prompt-v1

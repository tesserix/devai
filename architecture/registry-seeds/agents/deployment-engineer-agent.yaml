apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: deployment-engineer-agent
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: orchestration
    devai.io/skill: deployment-engineer
spec:
  skill: deployment-engineer
  promptRef: deployment-engineer-prompt-v1
  llm:
    provider: claude
    model: claude-sonnet-4-20250514
    temperature: null
    maxTokens: null
  limits:
    maxTurns: 30
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: high
  roleColor: admin

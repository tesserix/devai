apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: capacity-planner-agent
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: capacity-planner
spec:
  skill: capacity-planner
  promptRef: capacity-planner-prompt-v1
  llm:
    provider: openai
    model: gpt-4.1
    temperature: null
    maxTokens: null
  limits:
    maxTurns: 20
    timeoutSeconds: 900
  runtime:
    kind: python_class
    pythonClass: devai.sre.agents.capacity_planner.CapacityPlannerAgent
  riskLevel: low
  roleColor: admin

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: capacity-planner-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: capacity-planner
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Capacity Planner
  description: Forecasts when each app will hit its current resource ceiling at the current growth rate.
    Recommends HPA / VPA / cluster-autoscaler tweaks. Runs the long-tail (7-day, 30-day) trend analysis
    the other monitors don't cover.
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080/a2a/v1/capacity-planner
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - capacity-planner
  prompts:
  - capacity-planner-prompt-v1
  promptRef: capacity-planner-prompt-v1

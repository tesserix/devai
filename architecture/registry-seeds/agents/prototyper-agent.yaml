apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: prototyper-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.3
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: specialist
    devai.io/skill: prototyper
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Prototype Builder
  description: Bolt-style fast prototyping role. Scaffolds a Vite + React 19 + Tailwind + shadcn UI from
    a screenshot / description, commits + pushes + opens PR before polishing. Used by the `prototype.yaml`
    blueprint.
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 100
    timeoutSeconds: 1500
  riskLevel: low
  evalSuite:
    ref: prototyper-golden-suite
    version: '1'
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/prototyper
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - prototyper
  prompts:
  - prototyper-prompt-v1
  promptRef: prototyper-prompt-v1

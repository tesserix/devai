apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: negotiator-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.2
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: specialist
    devai.io/skill: negotiator
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Requirement Negotiator
  description: "Multi-turn clarifying Q&A with the user. Used when intake decided \"clarify\" \u2014 the\
    \ negotiator asks one question at a time, waits for the user's answer, and continues until requirements\
    \ are concrete enough to proceed. Parks the task between turns."
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 12
    timeoutSeconds: 14400
  riskLevel: low
  evalSuite:
    ref: negotiator-golden-suite
    version: '1'
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/negotiator
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - negotiator
  prompts:
  - negotiator-prompt-v1
  promptRef: negotiator-prompt-v1

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: ci-monitor-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: review
    devai.io/skill: ci-monitor
    devai.io/risk-level: medium
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: CI Engineer
  description: "Watches GitHub Actions for the PR's CI run and either confirms green or autonomously fixes\
    \ a broken workflow. Owns `.github/workflows/` \u2014 every other role escalates to ci_monitor for\
    \ CI changes."
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/ci-monitor
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - ci-monitor
  prompts:
  - ci-monitor-prompt-v1
  promptRef: ci-monitor-prompt-v1

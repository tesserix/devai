apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: postmortem-writer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: postmortem-writer
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Postmortem Writer
  description: "Closes out a run by writing a blameless postmortem from the root cause, the actions taken,\
    \ and the timeline \u2014 and optionally filing it as a tracking issue. Reasoning + SCM only; touches\
    \ no cluster resources."
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/postmortem-writer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - postmortem-writer
  prompts:
  - postmortem-writer-prompt-v1
  promptRef: postmortem-writer-prompt-v1

apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: root-cause-analyst-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: root-cause-analyst
spec:
  skill: root-cause-analyst
  promptRef: root-cause-analyst-prompt-v1
  llm:
    provider: claude
    model: claude-sonnet-4-20250514
    temperature: 0.2
    maxTokens: null
  limits:
    maxTurns: 8
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: low
  roleColor: engineer

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: intake-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.2
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: specialist
    devai.io/skill: intake
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Intake Triager
  description: "Pre-sandbox decision: should the pipeline proceed, ask the user to clarify, or propose\
    \ an alternate plan? Acts as the human-friendly front door \u2014 never modifies code, never opens\
    \ a PR."
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/intake
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - intake
  prompts:
  - intake-prompt-v1
  promptRef: intake-prompt-v1

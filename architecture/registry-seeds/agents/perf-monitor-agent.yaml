apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: perf-monitor-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: perf-monitor
spec:
  skill: perf-monitor
  promptRef: perf-monitor-prompt-v1
  llm:
    provider: openai
    model: gpt-4.1
    temperature: null
    maxTokens: null
  limits:
    maxTurns: 25
    timeoutSeconds: 900
  runtime:
    kind: python_class
    pythonClass: devai.sre.agents.perf_monitor.PerfMonitorAgent
  riskLevel: low
  roleColor: admin

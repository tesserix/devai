apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: security-auditor-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: security-auditor
spec:
  skill: security-auditor
  promptRef: security-auditor-prompt-v1
  llm:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    maxTokens: null
  limits:
    maxTurns: 24
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: medium
  roleColor: security

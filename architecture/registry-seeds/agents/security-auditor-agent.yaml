apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: security-auditor-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.0
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: security-auditor
    devai.io/risk-level: medium
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Security Auditor
  description: "Scans the running cluster for security posture issues \u2014 publicly exposed services,\
    \ expiring TLS certificates, risky workload settings, and Google Cloud Recommender security findings.\
    \ Read-only: it reports and ranks, it never changes anything."
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/security-auditor
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - id: security-auditor
    name: Security Auditor
    description: "Scans the running cluster for security posture issues \u2014 publicly exposed services,\
      \ expiring TLS certificates, risky workload settings, and Google Cloud Recommender security findings.\
      \ Read-only: it reports and ranks, it never changes anything."
    tags:
    - sre
    - medium
    - devai

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: security-expert-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.3
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: review
    devai.io/skill: security-expert
    devai.io/risk-level: high
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Principal Security Engineer
  description: "Hard security gate. Runs SAST + SCA + secret detection + container scan + OWASP Top 10\
    \ against the PR diff. READ-ONLY on application code \u2014 files findings, doesn't fix them. Blocks\
    \ pipeline on CRITICAL/HIGH findings."
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 80
    timeoutSeconds: 600
  riskLevel: high
  evalSuite:
    ref: security-expert-golden-suite
    version: '1'
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/security-expert
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - security-expert
  prompts:
  - security-expert-prompt-v1
  promptRef: security-expert-prompt-v1

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: weather-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.0
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: specialist
    devai.io/skill: weather
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Weather Agent
  description: Answers current-weather questions for the deterministic Weather sample and reports unsupported
    locations without inventing observations.
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 4
    timeoutSeconds: 120
  riskLevel: low
  evalSuite:
    ref: weather-golden-suite
    version: '1'
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/weather
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - weather
  prompts:
  - weather-prompt-v1
  promptRef: weather-prompt-v1
  tools:
  - weather-current

apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: sre-supervisor-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: orchestration
    devai.io/skill: sre-supervisor
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: SRE Supervisor
  description: "Senior SRE / incident commander that plans a monitoring or incident run before any agent\
    \ investigates. Reads the discovered cluster topology and the run intent, then produces a delegation\
    \ plan: which SRE specialists to dispatch, in what order, against which namespaces, and what each\
    \ should focus on. Pure planning \u2014 never touches the cluster. The multi-agent SRE blueprints\
    \ hand off to it first."
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 20
    timeoutSeconds: 480
  riskLevel: low
  evalSuite:
    ref: sre-supervisor-golden-suite
    version: '1'
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/sre-supervisor
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - sre-supervisor
  prompts:
  - sre-supervisor-prompt-v1
  promptRef: sre-supervisor-prompt-v1

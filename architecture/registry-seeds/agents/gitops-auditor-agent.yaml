apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: gitops-auditor-agent
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: gitops-auditor
spec:
  skill: gitops-auditor
  promptRef: gitops-auditor-prompt-v1
  llm:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: null
    maxTokens: null
  limits:
    maxTurns: 20
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: low
  roleColor: admin

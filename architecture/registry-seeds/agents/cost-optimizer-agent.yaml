apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: cost-optimizer-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: cost-optimizer
spec:
  skill: cost-optimizer
  promptRef: cost-optimizer-prompt-v1
  llm:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    maxTokens: null
  limits:
    maxTurns: 24
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: low
  roleColor: product

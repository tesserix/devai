apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: db-engineer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: coding
    devai.io/skill: db-engineer
    devai.io/risk-level: high
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Database Engineer
  description: Schema management, migration safety, data integrity. Produces Liquibase changesets for
    any schema deltas the senior_developer introduced via ORM models. Hard-gates the pipeline on destructive
    changes (drops, type narrows).
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080/a2a/v1/db-engineer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - db-engineer
  prompts:
  - db-engineer-prompt-v1
  promptRef: db-engineer-prompt-v1

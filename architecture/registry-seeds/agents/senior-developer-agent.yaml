apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: senior-developer-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.0
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: coding
    devai.io/skill: senior-developer
    devai.io/risk-level: medium
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Senior Software Engineer
  description: Implement ONE user story on its own feature branch. Read the story plan, follow repo conventions,
    write code + co-located unit tests, validate compile/lint/test, open a PR linked to the story issue.
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://devai-api.devai.svc.cluster.local:8080/a2a/v1/senior-developer
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - id: senior-developer
    name: Senior Software Engineer
    description: Implement ONE user story on its own feature branch. Read the story plan, follow repo
      conventions, write code + co-located unit tests, validate compile/lint/test, open a PR linked to
      the story issue.
    tags:
    - coding
    - medium
    - devai

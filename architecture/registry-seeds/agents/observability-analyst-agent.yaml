apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: observability-analyst-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.1
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: observability-analyst
    devai.io/risk-level: low
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Observability Analyst
  description: "Pulls signal from the tenant's connected observability backends \u2014 Datadog, New Relic,\
    \ CloudWatch, Azure Monitor, Prometheus, Elasticsearch, Grafana \u2014 through one vendor-neutral\
    \ fan-out tool. It discovers which sources are connected, queries metrics/logs/alerts across one or\
    \ many, and reports a cross-source health picture. Read-only."
  model:
    provider: devai-user-routing
    name: dynamic
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080/a2a/v1/observability-analyst
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - observability-analyst
  prompts:
  - observability-analyst-prompt-v1
  promptRef: observability-analyst-prompt-v1

apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: deployment-inspector-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: deployment-inspector
spec:
  skill: deployment-inspector
  promptRef: deployment-inspector-prompt-v1
  llm:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    maxTokens: null
  limits:
    maxTurns: 20
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: low
  roleColor: engineer

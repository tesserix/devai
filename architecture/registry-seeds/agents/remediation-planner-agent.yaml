apiVersion: registry.agentic.dev/v1alpha1
kind: Agent
metadata:
  name: remediation-planner-agent
  namespace: devai
  tenantId: devai
  tag: 1.0.3
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: remediation-planner
    devai.io/risk-level: medium
    ai.tesserix.dev/runtime: tesserix-adk
    ai.tesserix.dev/provider-policy: user-connectors
spec:
  title: Remediation Planner
  description: "Turns a root-cause hypothesis into a concrete, ordered remediation plan \u2014 separating\
    \ safe auto-remediations from changes that need human approval. It plans; the Incident Responder executes.\
    \ Read-only with respect to the cluster."
  model:
    provider: devai-user-routing
    name: dynamic
  limits:
    maxTurns: 16
    timeoutSeconds: 480
  riskLevel: medium
  evalSuite:
    ref: remediation-planner-golden-suite
    version: '1'
  a2a:
    url: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8082/a2a/v1/remediation-planner
    preferredTransport: JSONRPC
    provider:
      organization: Tesserix
      url: https://tesserix.app
    capabilities:
      streaming: false
      pushNotifications: false
    defaultInputModes:
    - application/json
    - text/plain
    defaultOutputModes:
    - application/json
    - text/plain
  skills:
  - remediation-planner
  prompts:
  - remediation-planner-prompt-v1
  promptRef: remediation-planner-prompt-v1

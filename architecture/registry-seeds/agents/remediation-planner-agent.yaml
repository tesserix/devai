apiVersion: registry.solo.io/v1alpha1
kind: Agent
metadata:
  name: remediation-planner-agent
  namespace: devai
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/skill: remediation-planner
spec:
  skill: remediation-planner
  promptRef: remediation-planner-prompt-v1
  llm:
    provider: claude
    model: claude-sonnet-4-20250514
    temperature: 0.2
    maxTokens: null
  limits:
    maxTurns: 16
    timeoutSeconds: 900
  runtime:
    kind: yaml_only
    pythonClass: null
  riskLevel: medium
  roleColor: admin

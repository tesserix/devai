apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: sandbox-file-read
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    mcp.devai.io/server: sandbox
    devai.io/domain: sandbox
    devai.io/tier: core
    devai.io/risk-level: low
  annotations:
    mcp.devai.io/wire-name: file_read
spec:
  displayName: File Read
  description: Read a file from the sandbox workspace.
  version: '1'
  server: sandbox
  inputSchema:
    type: object
    properties:
      path:
        type: string
    required:
    - path
  tags:
  - sandbox
  - mcp-tool
  - workspace

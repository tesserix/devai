apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: gitops-argocd-rollback
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    mcp.devai.io/server: gitops-mcp
    devai.io/domain: gitops
    devai.io/tier: core
    devai.io/risk-level: medium
  annotations:
    mcp.devai.io/wire-name: argocd_rollback
spec:
  displayName: Argocd Rollback
  description: "Roll an Argo CD Application back to a previous revision (history id from argocd_app_history;\
    \ blank = previous deployment). Mutating \u2014 gated and audited."
  version: '1'
  server: gitops-mcp
  inputSchema:
    type: object
    properties:
      name:
        type: string
        description: Target name
      revision:
        type: string
        description: History id to return to (optional)
    required:
    - name
  tags:
  - gitops
  - mcp-tool

apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: gitops-argocd-app-history
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    mcp.devai.io/server: gitops-mcp
    devai.io/domain: gitops
    devai.io/tier: core
    devai.io/risk-level: low
  annotations:
    mcp.devai.io/wire-name: argocd_app_history
spec:
  displayName: Argocd App History
  description: "Deployment history (revision ids + timestamps) of an Argo CD Application \u2014 needed\
    \ before rollback."
  version: '1'
  server: gitops-mcp
  inputSchema:
    type: object
    properties:
      name:
        type: string
        description: Target name
    required:
    - name
  tags:
  - gitops
  - mcp-tool

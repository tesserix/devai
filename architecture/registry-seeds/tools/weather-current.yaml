apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: weather-current
  namespace: devai
  tag: "1"
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/domain: learning
    devai.io/risk-level: low
  annotations:
    devai.io/wire-name: weather-current
spec:
  displayName: Current Weather
  description: Return a deterministic current-weather fixture for a supported city.
  version: "1"
  inputSchema:
    type: object
    additionalProperties: false
    required:
      - location
    properties:
      location:
        type: string
        minLength: 1
        maxLength: 100
      unit:
        type: string
        enum:
          - celsius
          - fahrenheit
        default: celsius
  tags:
    - weather
    - deterministic
    - read-only

apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: scm-scm-get-pr-diff
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    mcp.devai.io/server: scm-mcp
    devai.io/domain: scm
    devai.io/tier: core
    devai.io/risk-level: low
  annotations:
    mcp.devai.io/wire-name: scm_get_pr_diff
spec:
  displayName: Scm Get Pr Diff
  description: Get the diff of a pull request or merge request.
  version: '1'
  server: scm-mcp
  inputSchema:
    type: object
    properties:
      repo:
        type: string
        description: Repository identifier
      pr_id:
        type: integer
        description: Pull request or merge request number/ID
    required:
    - repo
    - pr_id
  tags:
  - mcp-tool
  - scm

apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: scm-scm-close-issue
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    mcp.devai.io/server: scm-mcp
    devai.io/domain: scm
    devai.io/tier: core
    devai.io/risk-level: medium
  annotations:
    mcp.devai.io/wire-name: scm_close_issue
spec:
  displayName: Scm Close Issue
  description: Close an issue or work item (e.g. after the release that ships it).
  version: '1'
  server: scm-mcp
  inputSchema:
    type: object
    properties:
      repo:
        type: string
        description: Repository identifier
      issue_id:
        type: integer
        description: Issue number or work item ID
    required:
    - repo
    - issue_id
  tags:
  - mcp-tool
  - scm

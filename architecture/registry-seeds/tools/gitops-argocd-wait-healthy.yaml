apiVersion: registry.solo.io/v1alpha1
kind: Tool
metadata:
  name: gitops-argocd-wait-healthy
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    mcp.devai.io/server: gitops-mcp
    devai.io/domain: gitops
    devai.io/tier: core
    devai.io/risk-level: low
  annotations:
    mcp.devai.io/wire-name: argocd_wait_healthy
spec:
  displayName: Argocd Wait Healthy
  description: Poll an Argo CD Application until Synced+Healthy, Degraded, Failed or timeout. Use after
    argocd_sync.
  version: '1'
  server: gitops-mcp
  inputSchema:
    type: object
    properties:
      name:
        type: string
        description: Target name
      timeout:
        type: integer
        description: Max seconds to wait (default 300)
      cluster:
        type: string
        description: "Optional \u2014 the name of one of YOUR connected Kubernetes clusters (Settings\
          \ \u2192 Kubernetes Cluster). Omit to use the platform cluster."
      argocd:
        type: string
        description: "Optional \u2014 the name of one of YOUR connected Argo CD instances (Settings \u2192\
          \ Argo CD, API mode). Targets that managed Argo CD's API directly."
    required:
    - name
  tags:
  - gitops
  - mcp-tool

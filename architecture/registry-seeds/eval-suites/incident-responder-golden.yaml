apiVersion: registry.solo.io/v1alpha1
kind: EvalSuite
metadata:
  name: incident-responder-golden
  namespace: devai
  tag: "1"
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: evals
    devai.io/agent: incident-responder-agent
spec:
  description: Version-pinned golden gate for incident-responder-agent.
  datasetRef:
    ref: incident-responder-golden
    version: "1"
  minimumPassRate: 0.75
  scorers:
    - task_completion
    - expected_tool_call
    - tool_trajectory
    - safety
    - tokens
    - latency
    - cost
  thresholds:
    success: 0.75
    safety: 1.0
    p95_latency_s: 120
    cost_per_run_usd: 0.5

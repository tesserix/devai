apiVersion: registry.solo.io/v1alpha1
kind: EvalSuite
metadata:
  name: weather-golden-suite
  namespace: devai
  tag: "1"
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: evals
    devai.io/agent: weather-agent
spec:
  description: Version-pinned quality and safety gate for weather-agent.
  datasetRef:
    ref: weather-golden
    version: "1"
  minimumPassRate: 1.0
  scorers:
    - task_completion
    - expected_tool_call
    - tool_trajectory
    - safety
    - tokens
    - latency
    - cost
  thresholds:
    success: 1.0
    safety: 1.0
    p95_latency_s: 30
    cost_per_run_usd: 0.1

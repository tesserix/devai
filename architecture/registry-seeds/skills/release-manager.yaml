apiVersion: registry.solo.io/v1alpha1
kind: Skill
metadata:
  name: release-manager
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: orchestration
    devai.io/risk-level: critical
spec:
  displayName: Release Manager
  description: Merge story PRs in dependency order, close the epic, trigger deployment (ArgoCD or direct
    kubectl), and post the release report. Final stage in the ALM pipeline. Hard-gated by risk_level=critical
    in production.
  category: orchestration
  tools:
  - scm_get_pull_request
  - scm_merge_pull_request
  - scm_close_issue
  - scm_add_comment
  - argocd_sync
  - argocd_get_app
  - argocd_wait_healthy
  - argocd_app_history
  - argocd_rollback
  - kargo_list_stages
  - kargo_list_freight
  - kargo_promote
  - kargo_list_promotions
  - flux_get_object
  - flux_reconcile
  handoverSchema:
    deploy_status:
      type: string
      required: true
      description: deployed | deploy_failed | merged_only | skipped
    deploy_environment:
      type: string
      required: false
      description: staging | production
    deploy_version:
      type: string
      required: false
    merged_prs:
      type: array
      required: false
    argocd_app:
      type: string
      required: false
    release_notes_url:
      type: string
      required: false
  contextKeys:
  - product_director_output
  - story_branches
  - infra_provisioner_output
  outputKey: release_manager_output
  metadata:
    owner: alm-team
    fiber_parity: release_manager

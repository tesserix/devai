apiVersion: registry.solo.io/v1alpha1
kind: Skill
metadata:
  name: gitops-auditor
  namespace: devai
  visibility: public
  labels:
    devai.io/source: devai
    devai.io/category: sre
    devai.io/risk-level: low
spec:
  displayName: GitOps Auditor
  description: "Read-only GitOps hygiene sweep across all three controllers. Finds Argo CD apps OutOfSync/Degraded\
    \ or stuck mid-operation, Flux objects that are suspended, not Ready, or pinned to stale revisions,\
    \ failing Flux sources, and Kargo stages with failed promotions or freight that stopped flowing. Issues\
    \ no mutations \u2014 it reports drift with evidence so the responder or a human can act."
  category: sre
  tools:
  - argocd_list_apps
  - argocd_get_app
  - argocd_app_history
  - flux_list_kustomizations
  - flux_list_helmreleases
  - flux_list_sources
  - flux_get_object
  - kargo_list_projects
  - kargo_list_stages
  - kargo_list_promotions
  handoverSchema:
    findings:
      type: array
      required: true
      description: 'Each {controller: argocd|flux|kargo, target, severity: critical|high|medium|low, kind:
        out_of_sync|degraded|stuck_operation|suspended|not_ready|source_failing| promotion_failed|freight_stalled,
        evidence, recommendation}.'
    healthy_count:
      type: integer
      required: true
      description: Targets inspected that are fully healthy.
    summary:
      type: string
      required: true
  contextKeys:
  - discovery_output
  outputKey: gitops_auditor_output
  metadata:
    owner: sre-team
    status: yaml_only

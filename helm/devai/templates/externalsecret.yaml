apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.externalSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.externalSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: DEVAI_OPENAI_API_KEY
      remoteRef:
        key: prod-devai-openai-api-key
        version: latest
    - secretKey: DEVAI_ANTHROPIC_API_KEY
      remoteRef:
        key: prod-devai-anthropic-api-key
        version: latest
    - secretKey: DEVAI_GITHUB_APP_ID
      remoteRef:
        key: prod-devai-github-app-id
        version: latest
    - secretKey: DEVAI_GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: prod-devai-github-app-private-key
        version: latest
    - secretKey: DEVAI_GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: prod-devai-github-app-installation-id
        version: latest
    - secretKey: DEVAI_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: prod-devai-github-webhook-secret
        version: latest
    - secretKey: DEVAI_GITHUB_OAUTH_CLIENT_ID
      remoteRef:
        key: prod-devai-github-oauth-client-id
        version: latest
    - secretKey: DEVAI_GITHUB_OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-devai-github-oauth-client-secret
        version: latest

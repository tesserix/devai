name: alm-pipeline
description: >-
  Full Application Lifecycle Management pipeline — ports the existing 14-node
  LangGraph orchestrator. Drives a requirement from intake through epic /
  stories / planning / implementation, gates with review + security + tests,
  then deploys via release manager. Each stage delegates to one of the
  existing agents in src/devai/agents/.

metadata:
  domain: alm
  replaces: devai.graph.orchestrator.ALMOrchestrator
  # Render hints for the dashboard flow view (ignored by the executor).
  title: Application Lifecycle
  lanes: [plan, build, review, deploy]

stages:
  # ─── Intake ────────────────────────────────────────────────────────
  - name: create-issue
    type: deterministic
    stage: create_issue
    lane: plan
    timeout: 60s
    config:
      title_template: "[devai] {intent}"

  - name: hydrate-context
    type: context
    stage: context_hydration
    lane: plan
    depends_on: [create-issue]
    timeout: 30s

  - name: inject-memory
    type: context
    stage: memory_injection
    lane: plan
    depends_on: [create-issue]
    timeout: 30s
    config:
      k: "5"

  # ─── Planning chain ────────────────────────────────────────────────
  - name: ingest-documents
    type: agentic
    stage: ingest_documents
    agent: document_analyzer
    lane: plan
    depends_on: [hydrate-context, inject-memory]
    timeout: 15m

  - name: detect-tech-stack
    type: agentic
    stage: detect_tech_stack
    agent: tech_detector
    lane: plan
    depends_on: [ingest-documents]
    timeout: 5m

  - name: analyze-requirements
    type: agentic
    stage: analyze_requirements
    agent: requirements_analyst
    lane: plan
    depends_on: [detect-tech-stack]
    timeout: 10m

  - name: create-epic
    type: agentic
    stage: create_epic
    agent: product_director_epic
    lane: plan
    depends_on: [analyze-requirements]
    timeout: 10m

  - name: create-stories
    type: agentic
    stage: create_stories
    agent: product_director_stories
    lane: plan
    depends_on: [create-epic]
    timeout: 5m
    on_failure: continue

  - name: create-plan
    type: agentic
    stage: create_plan
    agent: engineering_manager
    lane: plan
    depends_on: [create-stories]
    timeout: 15m

  # ─── Smart plan gate ────────────────────────────────────────────────
  # Pauses ONLY when the intent is judged ambiguous (autonomy=auto): the
  # human gets the epic + technical plan + tech stack + the open questions
  # in one approval request. Clear intents flow straight through.
  - name: plan-approval
    type: review
    stage: plan_approval
    lane: plan
    depends_on: [create-plan]
    timeout: 24h

  # ─── Implementation ─────────────────────────────────────────────────
  - name: implement-code
    type: agentic
    stage: implement_code
    agent: senior_developer
    lane: build
    depends_on: [plan-approval]
    timeout: 30m

  - name: db-engineering
    type: agentic
    stage: db_engineering
    agent: db_engineer
    lane: build
    title: DB Engineering
    depends_on: [implement-code]
    timeout: 10m
    on_failure: continue

  # ─── Quality gates ──────────────────────────────────────────────────
  - name: review-code
    type: review
    stage: review_code
    agent: staff_reviewer
    lane: review
    depends_on: [implement-code, db-engineering]
    timeout: 15m

  - name: security-scan
    type: review
    stage: security_scan
    agent: security_expert
    lane: review
    depends_on: [review-code]
    timeout: 10m

  - name: monitor-build
    type: deterministic
    stage: monitor_build
    agent: ci_monitor
    lane: review
    title: CI Build
    depends_on: [security-scan]
    timeout: 20m

  - name: run-tests
    type: review
    stage: run_tests
    agent: qa_tester
    lane: review
    depends_on: [monitor-build]
    timeout: 20m

  # ─── Final review + deploy ──────────────────────────────────────────
  - name: staff-review
    type: review
    stage: staff_review
    agent: staff_reviewer
    lane: review
    gate: true
    depends_on: [run-tests]
    timeout: 15m

  - name: provision-infra
    type: deploy
    stage: provision_infra
    agent: infra_provisioner
    lane: deploy
    depends_on: [staff-review]
    timeout: 15m

  - name: deploy-release
    type: deploy
    stage: deploy_release
    agent: release_manager
    lane: deploy
    gate: true
    depends_on: [provision-infra]
    timeout: 20m

  # ─── Reporting + learning + cleanup ─────────────────────────────────
  - name: post-report
    type: deterministic
    stage: post_report
    lane: deploy
    depends_on: [deploy-release]
    on_failure: continue
    config:
      title: "DevAI ALM Pipeline Report"
      target: pr

  - name: learn
    type: deterministic
    stage: alm_learn
    lane: deploy
    depends_on: [post-report]
    on_failure: continue

  - name: cleanup
    type: deterministic
    stage: cleanup
    lane: deploy
    depends_on: [learn]
    on_failure: continue

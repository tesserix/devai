name: alm-pipeline
description: >-
  Full Application Lifecycle Management pipeline — ports the existing 14-node
  LangGraph orchestrator. Drives a requirement from intake through epic /
  stories / planning / implementation, gates with review + security + tests,
  then deploys via release manager. Each stage delegates to one of the
  existing agents in src/devai/agents/.

metadata:
  domain: alm
  replaces: devai.graph.orchestrator.ALMOrchestrator
  # Render hints for the dashboard flow view (ignored by the executor).
  title: Application Lifecycle
  lanes: [plan, build, review, deploy]

stages:
  # ─── Intake ────────────────────────────────────────────────────────
  - name: create-issue
    type: deterministic
    stage: create_issue
    lane: plan
    timeout: 60s
    config:
      title_template: "[devai] {intent}"

  - name: hydrate-context
    type: context
    stage: context_hydration
    lane: plan
    depends_on: [create-issue]
    timeout: 30s

  - name: inject-memory
    type: context
    stage: memory_injection
    lane: plan
    depends_on: [create-issue]
    timeout: 30s
    config:
      k: "5"

  # ─── Planning chain ────────────────────────────────────────────────
  - name: ingest-documents
    type: agentic
    stage: ingest_documents
    agent: document_analyzer
    lane: plan
    depends_on: [hydrate-context, inject-memory]
    timeout: 15m

  - name: detect-tech-stack
    type: agentic
    stage: detect_tech_stack
    agent: tech_detector
    lane: plan
    depends_on: [ingest-documents]
    timeout: 5m

  - name: analyze-requirements
    type: agentic
    stage: analyze_requirements
    agent: requirements_analyst
    lane: plan
    depends_on: [detect-tech-stack]
    timeout: 10m

  # ─── Clarification gate — ASK a human when requirements are too open ──
  # When the analyst flags significant open questions (needs_clarification), a
  # human is asked to clarify BEFORE the platform commits to building, instead of
  # agents guessing. gate: true → pauses in gated mode; self-approves under full
  # autonomy (the open questions are still surfaced on the run).
  - name: clarify-requirements
    type: review
    stage: clarification_gate
    lane: plan
    title: Clarify Requirements
    gate: true
    depends_on: [analyze-requirements]
    condition: "output.needs_clarification"
    timeout: 24h

  # ─── Boardroom (debate the approach) — BEFORE epic + stories ─────────
  # Auto-fires when the trigger sets agent_context.brainstorm OR the analyst
  # judged the work LARGE (scope_large). Runs BEFORE the epic + stories so its
  # agreed decision (boardroom_decision, surfaced) SHAPES them: the epic is built
  # to realize the agreement, the stories inherit it, and the engineering manager
  # + developer all follow ONE coordinated decision. So a proper boardroom
  # discussion makes the epic + all related stories robust — not just the code.
  - name: boardroom-debate
    type: review
    stage: boardroom_debate
    agent: supervisor
    lane: plan
    title: Boardroom Debate
    depends_on: [clarify-requirements]
    condition: "output.brainstorm or output.scope_large"
    timeout: 30m
    config:
      rounds: "2"

  - name: create-epic
    type: agentic
    stage: create_epic
    agent: product_director_epic
    lane: plan
    depends_on: [boardroom-debate]
    timeout: 10m

  - name: create-stories
    type: agentic
    stage: create_stories
    agent: product_director_stories
    lane: plan
    depends_on: [create-epic]
    timeout: 5m

  - name: create-plan
    type: agentic
    stage: create_plan
    agent: engineering_manager
    lane: plan
    depends_on: [create-stories]
    timeout: 15m

  # ─── Smart plan gate ────────────────────────────────────────────────
  # Pauses ONLY when the intent is judged ambiguous (autonomy=auto): the
  # human gets the epic + technical plan + tech stack + the open questions
  # in one approval request. Clear intents flow straight through.
  - name: plan-approval
    type: review
    stage: plan_approval
    lane: plan
    depends_on: [create-plan]
    timeout: 24h

  # ─── Implementation ─────────────────────────────────────────────────
  - name: implement-code
    type: agentic
    stage: implement_code
    agent: senior_developer
    lane: build
    depends_on: [plan-approval]
    timeout: 60m   # full-app builds commit file-by-file; retries continue incrementally

  - name: db-engineering
    type: agentic
    stage: db_engineering
    agent: db_engineer
    lane: build
    title: DB Engineering
    depends_on: [implement-code]
    timeout: 10m

  # CLAUDE.md maintenance — commit the stack/structure/approved-plan facts
  # the run learned into the repo's governance file (on the PR branch), so
  # every agent and every FUTURE run reads current, repo-specific rules.
  - name: update-governance
    type: deterministic
    stage: update_governance
    lane: build
    title: Update Governance
    depends_on: [db-engineering]
    timeout: 5m
    on_failure: continue   # docs enrichment must never block delivery (heal runs first)

  # ─── Quality gates — review + security now actually GATE ─────────────
  # review_decision / security_decision used to be strings nothing read, so a
  # changes-requested review or a security block sailed to deploy. Each gate
  # now derives a boolean flag and runs a bounded fix→re-check loop (the same
  # shape as the self-healing test loop); `enforce-quality-gates` blocks
  # delivery if a verdict is still unresolved afterwards.
  - name: review-code
    type: review
    stage: review_code
    agent: staff_reviewer
    lane: review
    depends_on: [implement-code, db-engineering, update-governance]
    timeout: 15m

  - name: fix-review-findings
    type: agentic
    stage: fix_review_findings
    agent: senior_developer
    lane: build
    depends_on: [review-code]
    condition: "output.review_changes_requested"
    timeout: 45m

  - name: re-review-code
    type: review
    stage: re_review_code
    agent: staff_reviewer
    lane: review
    depends_on: [fix-review-findings]
    condition: "output.review_fix_applied"
    timeout: 15m

  - name: security-scan
    type: review
    stage: security_scan
    agent: security_expert
    lane: review
    depends_on: [re-review-code]
    timeout: 10m

  - name: fix-security-findings
    type: agentic
    stage: fix_security_findings
    agent: senior_developer
    lane: build
    depends_on: [security-scan]
    condition: "output.security_blocked"
    timeout: 45m

  - name: re-security-scan
    type: review
    stage: re_security_scan
    agent: security_expert
    lane: review
    depends_on: [fix-security-findings]
    condition: "output.security_fix_applied"
    timeout: 10m

  # Hard gate: only RUNS when a verdict is still unresolved (so reaching it
  # raises → runbook → devai:needs-human). When both gates pass it is skipped
  # and the run proceeds to CI.
  - name: enforce-quality-gates
    type: deterministic
    stage: enforce_flags
    lane: review
    title: Quality Gate
    depends_on: [re-security-scan]
    condition: "output.review_changes_requested or output.security_blocked"
    timeout: 2m
    config:
      flags: "review_changes_requested:code review still requests changes;security_blocked:security scan still blocks the PR"

  - name: monitor-build
    type: deterministic
    stage: monitor_build
    agent: ci_monitor
    lane: review
    title: CI Build
    depends_on: [enforce-quality-gates]
    timeout: 20m

  - name: run-tests
    type: review
    stage: run_tests
    agent: qa_tester
    lane: review
    depends_on: [monitor-build]
    timeout: 20m
    # NOTE: no on_failure:continue — a stage failure (harness broke) goes to
    # the recovery agent; FAILING TESTS are stage *output* (test_failed) and
    # flow into the diagnose→fix→retest loop below.

  # ─── Self-healing test loop ─────────────────────────────────────────
  # Failing tests don't kill the run: diagnose WHY (root cause), file a
  # linked bug issue (epic + stories + PR), apply a focused fix on the PR
  # branch, then re-run the tests. Bounded: one diagnose→fix→retest pass.
  - name: diagnose-test-failures
    type: analyst
    stage: diagnose_test_failures
    lane: review
    depends_on: [run-tests]
    condition: "output.test_failed"
    timeout: 10m

  - name: fix-test-failures
    type: agentic
    stage: fix_test_failures
    agent: senior_developer
    lane: build
    depends_on: [diagnose-test-failures]
    condition: "output.bug_issue_number"
    timeout: 45m

  - name: rerun-tests
    type: review
    stage: run_tests
    agent: qa_tester
    lane: review
    depends_on: [fix-test-failures]
    condition: "output.test_fix_applied"
    timeout: 20m

  # Hard gate: if tests are STILL failing after the bounded fix loop, block
  # delivery instead of shipping. The CI-truth validator already fails the stage
  # for CI-backed repos; this closes the NO-CI regime where test_failed flows
  # through as a "success" and nothing downstream reads it. Only RUNS (and
  # raises → runbook → devai:needs-human) when test_failed is still set.
  - name: enforce-tests
    type: deterministic
    stage: enforce_flags
    lane: review
    title: Tests Gate
    depends_on: [rerun-tests]
    condition: "output.test_failed"
    timeout: 2m
    config:
      flags: "test_failed:tests still failing after the diagnose-and-fix loop"

  # ─── Final review + deploy ──────────────────────────────────────────
  - name: staff-review
    type: review
    stage: staff_review
    agent: staff_reviewer
    lane: review
    gate: true
    depends_on: [enforce-tests]
    timeout: 15m

  - name: provision-infra
    type: deploy
    stage: provision_infra
    agent: infra_provisioner
    lane: deploy
    depends_on: [staff-review]
    timeout: 15m

  - name: deploy-release
    type: deploy
    stage: deploy_release
    agent: release_manager
    lane: deploy
    gate: true
    depends_on: [provision-infra]
    timeout: 20m

  # ─── Reporting + learning + cleanup ─────────────────────────────────
  - name: post-report
    type: deterministic
    stage: post_report
    lane: deploy
    depends_on: [deploy-release]
    on_failure: continue
    config:
      title: "DevAI ALM Pipeline Report"
      target: pr

  - name: learn
    type: deterministic
    stage: alm_learn
    lane: deploy
    depends_on: [post-report]
    on_failure: continue

  - name: cleanup
    type: deterministic
    stage: cleanup
    lane: deploy
    depends_on: [learn]
    on_failure: continue

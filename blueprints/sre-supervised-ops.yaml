name: sre-supervised-ops
description: >-
  Supervisor-led, multi-agent operations sweep. An SRE Supervisor plans
  the run, the cluster is discovered, then eight specialists investigate
  in parallel. Findings are correlated, the Root Cause Analyst forms a
  hypothesis, the SRE Orchestrator decides (auto-remediate | escalate |
  close) at a gate, the Remediation Planner produces a safe plan, the
  responder acts, and a blameless postmortem closes the run.

metadata:
  domain: sre
  kind: multi_agent
  pattern: supervisor+orchestrator
  title: SRE Supervised Ops
  cadence: every 10 minutes
  lanes: [plan, discovery, investigate, decide, respond, learn]

stages:
  # ─── Plan ──────────────────────────────────────────────────────────
  - name: supervise
    type: agentic
    stage: run_specialization
    lane: plan
    title: SRE Supervisor
    agent: sre_supervisor
    timeout: 8m
    config:
      specialization: sre_supervisor

  # ─── Discovery ─────────────────────────────────────────────────────
  - name: discover
    type: agentic
    stage: sre_discover
    lane: discovery
    depends_on: [supervise]
    timeout: 5m

  # ─── Parallel investigation fan-out (built-in monitors + new specialists) ──
  - name: monitor-infra
    type: agentic
    stage: sre_monitor_infra
    lane: investigate
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue

  - name: monitor-perf
    type: agentic
    stage: sre_monitor_perf
    lane: investigate
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue

  - name: monitor-logs
    type: agentic
    stage: sre_monitor_logs
    lane: investigate
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue

  - name: monitor-cost
    type: agentic
    stage: sre_monitor_cost
    lane: investigate
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue

  - name: monitor-capacity
    type: agentic
    stage: sre_monitor_capacity
    lane: investigate
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue

  - name: audit-security
    type: agentic
    stage: run_specialization
    lane: investigate
    title: Security Auditor
    agent: security_auditor
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue
    config:
      specialization: security_auditor

  - name: check-reliability
    type: agentic
    stage: run_specialization
    lane: investigate
    title: Reliability Analyst
    agent: reliability_analyst
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue
    config:
      specialization: reliability_analyst

  - name: inspect-deploys
    type: agentic
    stage: run_specialization
    lane: investigate
    title: Deployment Inspector
    agent: deployment_inspector
    depends_on: [discover]
    parallel: true
    timeout: 10m
    on_failure: continue
    config:
      specialization: deployment_inspector

  - name: observe-external
    type: agentic
    stage: run_specialization
    lane: investigate
    title: Observability Analyst
    agent: observability_analyst
    depends_on: [discover]
    parallel: true
    timeout: 12m
    on_failure: continue
    config:
      specialization: observability_analyst

  # ─── Correlate + reason ────────────────────────────────────────────
  - name: correlate
    type: analyst
    stage: sre_correlate
    lane: decide
    depends_on:
      - monitor-infra
      - monitor-perf
      - monitor-logs
      - monitor-cost
      - monitor-capacity
      - audit-security
      - check-reliability
      - inspect-deploys
      - observe-external
    timeout: 5m

  - name: root-cause
    type: analyst
    stage: run_specialization
    lane: decide
    title: Root Cause
    agent: root_cause_analyst
    depends_on: [correlate]
    timeout: 6m
    config:
      specialization: root_cause_analyst

  # ─── Decision gate ─────────────────────────────────────────────────
  - name: orchestrate
    type: review
    stage: run_specialization
    lane: decide
    title: SRE Orchestrator
    agent: sre_orchestrator
    gate: true
    depends_on: [root-cause]
    timeout: 5m
    config:
      specialization: sre_orchestrator

  # ─── Respond ───────────────────────────────────────────────────────
  - name: plan-remediation
    type: agentic
    stage: run_specialization
    lane: respond
    title: Remediation Plan
    agent: remediation_planner
    depends_on: [orchestrate]
    timeout: 8m
    config:
      specialization: remediation_planner

  - name: respond
    type: agentic
    stage: sre_respond
    lane: respond
    depends_on: [plan-remediation]
    timeout: 10m
    on_failure: continue

  - name: postmortem
    type: deterministic
    stage: run_specialization
    lane: learn
    title: Postmortem
    agent: postmortem_writer
    depends_on: [respond]
    timeout: 6m
    on_failure: continue
    config:
      specialization: postmortem_writer

  - name: learn
    type: deterministic
    stage: sre_learn
    lane: learn
    depends_on: [postmortem]
    timeout: 2m
    on_failure: continue

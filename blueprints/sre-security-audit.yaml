name: sre-security-audit
description: >-
  Sequential security posture audit. Discovers the cluster, the Security
  Auditor scans for exposure / cert / config / cloud findings, the
  Remediation Planner proposes safe fixes, and the responder records
  incidents. Linear chain.

metadata:
  domain: sre
  kind: sequential
  title: SRE Security Audit
  cadence: daily
  lanes: [discovery, audit, respond]

stages:
  - name: discover
    type: agentic
    stage: sre_discover
    lane: discovery
    timeout: 5m

  - name: audit
    type: agentic
    stage: run_specialization
    lane: audit
    title: Security Auditor
    agent: security_auditor
    depends_on: [discover]
    timeout: 10m
    config:
      specialization: security_auditor

  - name: plan-fixes
    type: agentic
    stage: run_specialization
    lane: respond
    title: Remediation Plan
    agent: remediation_planner
    depends_on: [audit]
    timeout: 8m
    config:
      specialization: remediation_planner

  - name: respond
    type: agentic
    stage: sre_respond
    lane: respond
    depends_on: [plan-fixes]
    timeout: 10m
    on_failure: continue

  - name: learn
    type: deterministic
    stage: sre_learn
    lane: respond
    depends_on: [respond]
    timeout: 2m
    on_failure: continue

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devai"
version = "0.1.0"
description = "AI-powered development lifecycle automation platform"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.52.0",
    "openai>=1.82.0",
    "nats-py>=2.9.0",
    "redis[hiredis]>=5.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer[all]>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyGithub>=2.6.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "python-ulid>=3.0.0",
    "rich>=13.9.0",
    "playwright>=1.49.0",
    "cryptography>=44.0.0",
    "PyJWT>=2.10.0",
    # PostgreSQL
    "asyncpg>=0.30.0",
    # Groq (fallback)
    "groq>=0.12.0",
    # Google Gemini
    "google-generativeai>=0.8.0",
    # GCP monitoring and management (pinned to avoid resolution-too-deep)
    "google-cloud-monitoring~=2.24.0",
    "google-cloud-logging~=3.11.0",
    "google-cloud-recommender~=2.16.0",
    "google-cloud-resource-manager~=1.13.0",
    "google-auth~=2.38.0",
    "google-api-core[grpc]~=2.24.0",
    "grpcio~=1.68.0",
    # LangGraph / LangChain / LangSmith
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langsmith>=0.2",
]

[project.optional-dependencies]
docs = [
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "fakeredis>=2.26.0",
]

[project.scripts]
devai = "devai.cli.commands:app"
devai-sre = "devai.sre.server:create_sre_app"

[tool.hatch.build.targets.wheel]
packages = ["src/devai"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devai"
version = "0.1.0"
description = "AI-powered development lifecycle automation platform"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=1.2.0",
    "openai>=3.3.1",
    "nats-py>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.52.4",
    "typer[all]>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyGithub>=2.6.0",
    "httpx>=0.28.1",
    "keyring>=25.6.0",
    "jsonschema>=4.26.0",
    "structlog>=26.1.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.42.1",
    # OTLP/HTTP exporter — backs the telemetry adapter family
    # (adapters/telemetry/otel.py) when DEVAI_TELEMETRY_PROVIDER=otel. Shipped
    # in the image so turning telemetry on is one env var, no custom build. The
    # adapter lazy-imports it and degrades to Noop if it's ever absent.
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "python-ulid>=4.0.1",
    "rich>=15.0.0",
    "playwright>=1.49.0",
    "cryptography>=50.0.0",
    "PyJWT>=2.10.0",
    # PostgreSQL
    "asyncpg>=0.31.0",
    # Groq (fallback)
    "groq>=0.12.0",
    # Google Gemini
    "google-genai==2.20.0",
    # GCP monitoring and management (exact pins to avoid resolution-too-deep)
    "google-cloud-monitoring==2.31.0",
    "google-cloud-logging==3.16.2",
    "google-cloud-recommender==2.22.0",
    "google-cloud-resource-manager==1.17.0",
    "google-auth==2.56.3",
    "google-api-core[grpc]==2.34.0",
    "grpcio==1.83.0",
    "grpcio-status==1.83.0",
    "proto-plus==1.27.2",
    "protobuf==6.33.5",
    "googleapis-common-protos==1.75.1",
    # LangGraph / LangChain / LangSmith
    "langgraph>=0.2",
    "langchain-core>=1.6.1",
    "langchain-anthropic>=0.3",
    "langchain-openai>=1.3.5",
    "langchain-community>=0.4.2",
    "langsmith>=0.2",
    # Kubernetes — async client backs the Job-runner stage that spawns
    # a Pod per agent run. See src/devai/runtime/k8s_client.py.
    "kubernetes-asyncio>=36.1.0",
    # Temporal — durable orchestration backbone. The workflow adapter family
    # (adapters/workflow) and the devai-worker (orchestration/worker.py) use it
    # when DEVAI_WORKFLOW_PROVIDER=temporal; with the default inproc provider it
    # is imported lazily only inside the temporal adapter, so it never loads.
    # Shipped in the image so the worker can run without a custom build.
    "temporalio>=1.32.0",
    # Remote conversational channels (src/devai/adapters/messaging). MCP server
    # (MCPServer, Streamable HTTP) exposes DevAI at /mcp; slack_sdk backs the
    # Slack Events API channel. Both are imported lazily inside their channels,
    # so a deployment with those channels disabled never loads them.
    "mcp>=2.1.1,<3",
    "httpx2>=2.5,<3",
    "slack-sdk>=3.43.0,<4",
    # Secrets adapter family (src/devai/adapters/secrets/gcp_sm.py). Auto-
    # provisions per-user/per-tenant secrets into Google Secret Manager.
    # Imported lazily inside the gcp_sm adapter only.
    "google-cloud-secret-manager==2.30.0",
    # GCS object-store backend (adapters/object_store/gcs.py) — composer
    # attachments + the log-archive listing on the dashboard /logs page.
    # Imported lazily inside the gcs adapter only.
    "google-cloud-storage>=3.13.1",
    "rapidfuzz>=3.14.3,<4",
    # Password hashing for the local_db identity backend (LOCAL/sandbox only).
    # Imported lazily inside src/devai/adapters/identity/local_db.py, so a
    # prod deployment (auth terminated at the auth-bff, noop backend) never
    # loads it. bcrypt backend bundled; argon2 used when its backend is present.
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
docs = [
    "pypdf>=6.16.1",
    "pdfplumber>=0.11.9",
    "pyyaml>=6.0.3",
]
# The agent runtime is pinned to the immutable tag that backs the GitHub Release.
kit = [
    "tesserix-adk @ git+https://github.com/tesserix/agent-development-kit@v0.54.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.15.19",
    "mypy>=2.3.1",
    "types-jsonschema>=4.26.0.20250822",
    "pytest-cov>=6.0.0",
    "respx>=0.23.1",
    "fakeredis>=2.26.0",
]
[project.scripts]
devai = "devai.cli.commands:app"
devai-sre = "devai.sre.server:create_sre_app"
devai-worker = "devai.orchestration.worker:main"
devai-mcp-hub = "devai.mcphub:create_hub_app"

[tool.hatch.build.targets.wheel]
packages = ["src/devai"]

# The `kit` extra installs from a git URL; hatchling refuses direct references
# in metadata unless this is set, and refuses at metadata time — so an unset
# flag breaks every install, not just `.[kit]`.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = [
    "E501",   # line length — handled by formatter, long strings are fine
    "TC001",  # typing-only first-party import — acceptable here (runtime use via DI)
    "TC003",  # typing-only stdlib import — same
    "B008",   # function call in default arg — FastAPI idiom (Query()/Depends())
    "N818",   # exception name w/o Error suffix — deliberate (AdapterNotConfigured, …)
    "UP042",  # (str, Enum) -> StrEnum — cosmetic churn, both are intentional here
    "SIM105", # contextlib.suppress over try/except/pass — style preference
    "SIM108", # ternary over if/else — style preference
    "SIM102", # collapsible if — style preference
    "E701",   # multiple statements on one line — style preference
    "UP031",  # printf-style formatting — style preference
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
